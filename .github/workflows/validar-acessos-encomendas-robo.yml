name: Validar acessos do Encomendas Robô
on:
  push:
    branches: [codex/validar-acessos-encomendas-robo]
    paths: [.github/workflows/validar-acessos-encomendas-robo.yml]

permissions: {}

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar autenticação e leitura sem alterar dados
        env:
          TENANT_ID: ${{ secrets.ENCOMENDAS_ROBO_TENANT_ID }}
          CLIENT_ID: ${{ secrets.ENCOMENDAS_ROBO_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ENCOMENDAS_ROBO_CLIENT_SECRET }}
        run: |
          node <<'NODE'
          async function main() {
            const { TENANT_ID, CLIENT_ID, CLIENT_SECRET } = process.env;
            const graph = 'https://graph.microsoft.com';
            const response = await fetch('https://login.microsoftonline.com/' + encodeURIComponent(TENANT_ID) + '/oauth2/v2.0/token', {
              method: 'POST',
              body: new URLSearchParams({
                client_id: CLIENT_ID,
                client_secret: CLIENT_SECRET,
                scope: graph + '/.default',
                grant_type: 'client_credentials',
              }),
              signal: AbortSignal.timeout(15000),
            });
            console.log('Autenticação: HTTP ' + response.status);
            if (!response.ok) return false;

            const { access_token: token } = await response.json();
            const drive = 'b!tDspHS-8_06fSneRoEVGiIzQ_wwWK5dJhqGpmrL0k_yVQ7fm29iyQ7jbVXGCuMch';
            const folder = '01NEJB4KDNHFIF25CJLVEKJDMOHLMRTL6U';
            const checks = [
              ['Pasta do SharePoint', '/drives/' + drive + '/items/' + folder + '?$select=id', 200],
              ['Caixa do robô', '/users/trueborn@montedopasto.pt/messages?$top=1&$select=id', 200],
              ['Caixa fora do âmbito', '/users/jose.almanso@montedopasto.pt/messages?$top=1&$select=id', 403],
            ];
            const results = await Promise.all(checks.map(async ([label, path, expected]) => {
              const result = await fetch(graph + '/v1.0' + path, {
                headers: { Authorization: 'Bearer ' + token },
                signal: AbortSignal.timeout(15000),
              });
              console.log(label + ': HTTP ' + result.status + ' (esperado ' + expected + ')');
              await result.body?.cancel();
              return result.status === expected;
            }));
            return results.every(Boolean);
          }

          main().then((ok) => { process.exitCode = ok ? 0 : 1; }).catch(() => {
            console.error('Falha na ligação ou no processamento da resposta.');
            process.exitCode = 1;
          });
          NODE
