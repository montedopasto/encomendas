name: Encomendas Robô

run-name: ${{ inputs.slot && format('Encomendas Robô UTC {0}', inputs.slot) || 'Encomendas Robô' }}

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Hora UTC indicada pelo agendador externo (yyyy-MM-ddTHH)'
        required: false
        type: string
  schedule:
    - cron: '7 6-21 * * *' # De hora a hora, das 06h às 21h UTC.

permissions:
  contents: read

concurrency:
  group: encomendas-robo
  cancel-in-progress: false

jobs:
  validar:
    if: github.event_name == 'workflow_dispatch' && inputs.slot == ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validar sintaxe e ficheiros
        run: |
          node --check robo/run.js
          node --check public/platform.js
          test -s public/app.html
          test -s public/config.js

  executar:
    if: >-
      vars.ENCOMENDAS_ROBO_ATIVO == 'true' &&
      ((github.event_name == 'schedule' && vars.ENCOMENDAS_ROBO_EXTERNO != 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.slot != '' && vars.ENCOMENDAS_ROBO_EXTERNO == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Instalar dependências
        working-directory: robo
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Executar robô
        working-directory: robo
        env:
          TENANT_ID: ${{ secrets.ENCOMENDAS_ROBO_TENANT_ID }}
          CLIENT_ID: ${{ secrets.ENCOMENDAS_ROBO_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ENCOMENDAS_ROBO_CLIENT_SECRET }}
          TZ: Europe/Lisbon
        run: node run.js
