  return out + '</div>';
}

/* Dias em armazém e custo: o custo é por SSCC (palete) por dia; um SSCC com várias linhas (artigos/lotes) divide o custo pelas linhas. */
function diasArmazem(l) { if (!l.entryDate) return null; const d = Math.round((Date.parse(Z.isoToday() + 'T12:00:00Z') - Date.parse(l.entryDate + 'T12:00:00Z')) / 86400000); return d < 0 ? 0 : d; }
const eur = (n) => n.toLocaleString('pt-PT', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
function withCost(view) {
  const rate = +S.cfg.custoSsccDia || 0;
  const per = {}; view.forEach((l) => { per[l.sscc] = (per[l.sscc] || 0) + 1; });
  return view.map((l) => { const dias = diasArmazem(l); return Object.assign({}, l, { dias, custo: rate > 0 && dias != null ? dias * rate / per[l.sscc] : null }); });
}
function costPanel(view) {
  const rate = +S.cfg.custoSsccDia || 0;
  const ssccs = new Set(view.map((l) => l.sscc)).size;
  const acum = view.reduce((t, l) => t + (l.custo || 0), 0);
  const semData = view.filter((l) => l.dias == null).length;
  const cxTot = view.reduce((t, l) => t + l.boxes, 0); const cxAvg = cxTot > 0 && acum > 0 ? acum / cxTot : null;
  const can = canAdmin();
  let out = '<section class="panel stack"><div class="row between" style="align-items:flex-end"><h2>Custo de armazém</h2>' +
    '<label class="f" style="width:auto">€ por SSCC por dia<input id="custodia" type="number" min="0" step="0.01" inputmode="decimal" style="width:150px;text-align:right" value="' + (rate || '') + '" placeholder="Ex.: 0,25"' + (can ? '' : ' readonly title="Só um administrador pode alterar"') + '></label></div>';
  if (!rate) out += '<div class="note info">Indique o custo diário de cada SSCC (palete) e a app calcula o custo de armazém de cada linha e os totais.</div>';
  else out += '<div class="kpis"><div class="kpi"><b>' + fmtN(ssccs) + '</b><span>SSCC em armazém</span></div>' +
    '<div class="kpi"><b>' + eur(ssccs * rate) + '</b><span>custo por dia (' + eur(rate) + ' × ' + fmtN(ssccs) + ' SSCC)</span></div>' +
    '<div class="kpi"><b>' + eur(ssccs * rate * 30) + '</b><span>custo a 30 dias, ao ritmo atual</span></div>' +
    '<div class="kpi"><b style="color:var(--bad)">' + eur(acum) + '</b><span>custo acumulado desde a entrada do stock atual</span></div></div>';
  out += '<div class="why">Dias em armazém = hoje − data de entrada (Delivery Date). Custo da linha = dias × €/SSCC/dia; quando um SSCC tem várias linhas, o custo é dividido entre elas. €/cx = custo acumulado ÷ caixas' + (cxAvg ? ' (média do stock: ' + eur(cxAvg) + '/cx; a laranja acima da média, a vermelho acima do dobro)' : '') + '; passe o rato para ver o custo por caixa por dia.' + (semData ? ' ' + semData + ' linha(s) sem data de entrada ficam sem custo.' : '') + '</div></section>';
  return out;
}

/* Quadro de quilos: totais por zona (FRZ, FRE…) com físico, reservado, disponível e indisponível. */
function kgPanel(view) {
  const kgFmt = (n) => (Math.round(n * 10) / 10).toLocaleString('pt-PT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const groups = {}; let semPeso = 0, semPesoCx = 0;
  const add = (g, l) => {
    const w = l.weight != null && l.weight > 0 && l.boxes > 0 ? l.weight : null;
    if (w == null) return false;
    const pb = w / l.boxes;
    g.fis += w;
    g.res += Math.min(l.reserved, l.boxes) * pb;
    if (l.status === 'elegivel') g.disp += l.available * pb;
    else if (l.status === 'bloqueado') g.bloq += w;
    else g.outros += w;
    return true;
  };
  const blank = () => ({ fis: 0, res: 0, disp: 0, bloq: 0, outros: 0 });
  const total = blank();
  view.forEach((l) => {
    const z = l.zone || 'Sem zona';
    const g = groups[z] || (groups[z] = blank());
    if (add(g, l)) add(total, l); else { semPeso++; semPesoCx += l.boxes; }
  });
  const zonas = Object.keys(groups).sort();
  const row = (name, g, strong) => '<tr' + (strong ? ' class="kg-total"' : '') + '><td>' + (strong ? '<b>' + h(name) + '</b>' : h(name) + ' ' + tempHtml(name)) + '</td>' +
    '<td class="num">' + kgFmt(g.fis) + '</td><td class="num">' + (g.res ? '≈ ' + kgFmt(g.res) : '—') + '</td>' +
    '<td class="num" style="color:var(--ok);font-weight:700">' + kgFmt(g.disp) + '</td>' +
    '<td class="num">' + (g.bloq ? '<span style="color:var(--bad)">' + kgFmt(g.bloq) + '</span>' : '—') + '</td><td class="num">' + (g.outros ? kgFmt(g.outros) : '—') + '</td></tr>';
  let out = '<section class="panel stack"><div class="row between"><h2>Quilos em stock</h2><div class="kg-big"><b>' + kgFmt(total.fis) + '</b> kg no total</div></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Zona</th><th class="num">Físico (kg)</th><th class="num">Reservado (kg)</th><th class="num">Disponível (kg)</th><th class="num">Bloqueado (kg)</th><th class="num">Validade / a rever (kg)</th></tr></thead><tbody>' +
    zonas.map((z) => row(z, groups[z])).join('') + (zonas.length > 1 ? row('Total', total, true) : '') + '</tbody></table></div>';
  // Divisão dos bloqueios por motivo (Palete Perdida, Pedido do Cliente, Controlo de Qualidade…)
  const mot = {};
  view.filter((l) => l.blocked).forEach((l) => {
    const k = l.motivo || 'Sem motivo indicado';
    const m = mot[k] || (mot[k] = { n: 0, cx: 0, kg: 0, semPeso: 0, neg: 0 });
    m.n++; m.cx += l.boxes;
    if (l.weight != null && l.weight > 0) m.kg += l.weight; else if (l.weight != null && l.weight < 0) m.neg++; else m.semPeso++;
  });
  const motK = Object.keys(mot).sort((x, y) => mot[y].kg - mot[x].kg);
  if (motK.length) {
    const aceites = S.cfg.motivosPermitidos || [];
    const tb = motK.filter((k) => !aceites.includes(k)).reduce((t, k) => ({ n: t.n + mot[k].n, cx: t.cx + mot[k].cx, kg: t.kg + mot[k].kg }), { n: 0, cx: 0, kg: 0 });
    out += '<h3 style="margin-top:6px">Bloqueado por motivo</h3><div class="tbl-wrap"><table><thead><tr><th>Motivo</th><th class="num">SSCC</th><th class="num">Caixas</th><th class="num">kg</th></tr></thead><tbody>' +
      motK.map((k) => { const m = mot[k]; const ok = aceites.includes(k);
        return '<tr' + (ok ? ' class="dim"' : '') + '><td>' + h(k) + (ok ? ' <span class="why">(aceite: conta como disponível)</span>' : '') + (m.semPeso ? ' <span class="why">· ' + m.semPeso + ' sem peso</span>' : '') + (m.neg ? ' <span class="why" style="color:var(--warn)">· ' + m.neg + ' com peso negativo no ficheiro</span>' : '') + '</td><td class="num">' + m.n + '</td><td class="num">' + fmtN(m.cx) + '</td><td class="num"' + (ok ? '' : ' style="color:var(--bad);font-weight:600"') + '>' + kgFmt(m.kg) + '</td></tr>'; }).join('') +
      '<tr class="kg-total"><td><b>Total bloqueado</b></td><td class="num"><b>' + tb.n + '</b></td><td class="num"><b>' + fmtN(tb.cx) + '</b></td><td class="num"><b>' + kgFmt(tb.kg) + '</b></td></tr></tbody></table></div>';
  }
  out += '<div class="why">Peso registado (#Weight) de cada SSCC. O reservado é estimado pelo peso médio por caixa de cada SSCC.' + (semPeso ? ' Sem peso registado: ' + semPeso + ' linha(s), ' + fmtN(semPesoCx) + ' cx (não entram nos totais).' : '') + '</div></section>';
  return out;
}

async function loadStockVision() {

    const p = r.payload || {};
    if (!p.content) throw new Error('O Google Drive não devolveu o conteúdo da folha.');
    const bin = Uint8Array.from(atob(p.content), (c) => c.charCodeAt(0));
    const wb = new window.ExcelJS.Workbook(); await wb.xlsx.load(bin.buffer);
    const parsed = Z.parseStockWorkbook(wb, p.title || 'StockVision', { sheetName: S.cfg.stockvisionAba });
    S.imp = { parsed, fileName: (p.title || 'StockVision') + ' · aba ' + S.cfg.stockvisionAba, fileDate: '', source: 'stockvision' };
  } catch (e) {
    const M = { server_not_connected: 'O Google Drive não está ligado à sua conta. Esta ligação não existe na versão do GitHub.', needs_reauth: 'A ligação ao Google Drive expirou. Recarregue a página e entre de novo com a conta Microsoft.', not_in_manifest: 'O acesso ao Google Drive foi recusado para esta app. Pode autorizá-lo no menu de permissões da página.', approval_required: 'É preciso aprovar a leitura no Google Drive. Carregue de novo e aprove.', tool_error: 'O Google Drive recusou o pedido (a folha existe e está partilhada consigo?).' };
    S.imp = { parsed: { ok: false, errors: [M[e && e.code] || ('Não foi possível ler o StockVision: ' + ((e && e.message) || e))], warnings: [], lines: [] }, fileName: 'StockVision' };
  }
  render();
}
let mailChecked = false;

  const d = new Date(); const c = new Date(d); c.setHours(h, 0, 0, 0);
  if (d < c) c.setDate(c.getDate() - 1);

}
function stockUpdatedToday() { return !!(S.stock.meta && S.stock.meta.importedAt && new Date(S.stock.meta.importedAt) >= stockDayStart()); }
function nextUpdateTxt() { const c = stockDayStart(); c.setDate(c.getDate() + 1); return (c.toDateString() === new Date().toDateString() ? 'hoje' : 'amanhã') + ' às ' + c.getHours() + 'h'; }
function showUpdating(on) { const el = $('#upd'); if (el) el.hidden = !on; }
/* Na primeira abertura do dia (a partir das 8h) atualiza o stock pelo email; até às 8h do dia seguinte já não procura. */
async function autoMailCheck() {

}

async function checkMailReport(auto) {
  if (!S.caps.mcp || (S.mail && S.mail.busy)) return;
  const pasta = S.cfg.emailPastaZolve || 'Zolve';
  S.mail = { busy: true };
  if (!auto) S.imp = { loading: true, fileName: 'Email · pasta ' + pasta };
  render();
  const now = new Date().toISOString();
  try {
    const r = await S.caps.mcp.callTool('Microsoft 365', 'outlook_email_search', { folderName: pasta, limit: 25 }, { cache: false });
    const pick = Z.pickDailyReports(Z.mailItems(r), S.cfg);
    if (!pick.found.length) throw { code: 'no_report' };
    const cur = S.stock.meta && S.stock.meta.fileDate;
    const newest = pick.found.reduce((m, b) => (b.date > m ? b.date : m), '');
    if (auto && (S.imp || (cur && newest && newest <= cur))) {
      S.mail = { at: now, kind: S.imp ? 'ok' : 'warn', msg: S.imp ? 'Há uma importação por rever; não substituí a pré-visualização.' : 'Ainda não chegaram relatórios novos da Logifrio: o stock continua a ser de ' + Z.fmtDate(cur) + '. A app volta a procurar na próxima abertura.' };
      if (!S.imp) toast('Ainda não chegaram os relatórios de hoje. O stock é de ' + Z.fmtDate(cur) + '.');
      return render();
    }
    if (auto && S.cfg.emailAutoAplicar !== false) {
      // Na importação automática espera-se que FRZ e FRE do mesmo dia estejam ambos no email.
      const falta = pick.missing.slice();
      pick.found.forEach((b) => { if (b.date !== newest) falta.push(b.tag); });
      if (falta.length) {
        const ja = pick.found.filter((b) => b.date === newest).map((b) => b.tag);
        S.mail = { at: now, kind: 'info', msg: 'Chegou o relatório ' + ja.join(' e ') + ' de ' + Z.fmtDate(newest) + '. À espera do ' + falta.join(' e ') + ' do mesmo dia para atualizar o stock. A app volta a procurar na próxima abertura.' };
        toast('Ainda falta o relatório ' + falta.join(' e ') + '. O stock não foi atualizado.');
        return render();
      }
    }
    const parts = [];
    for (const best of pick.found) {
      const uri = best.msg.uri || ('mail:///messages/' + encodeURIComponent(best.msg.id || ''));
      const mr = await S.caps.mcp.callTool('Microsoft 365', 'read_resource', { uri }, { cache: false });
      const msg = Z.mailItems(mr)[0] || (mr && mr.payload) || {};
      const att = Z.reportAttachment(msg);
      if (!att || !att.uri) { parts.push({ label: best.tag, name: best.tag, best, parsed: { ok: false, errors: ['A mensagem "' + (best.msg.subject || '') + '" não tem o anexo …_DailyReport.xlsx.'], warnings: [], lines: [] } }); continue; }
      const ar = await S.caps.mcp.callTool('Microsoft 365', 'read_resource', { uri: att.uri }, { cache: false });
      const pr = Z.parseStockText(Z.resultText(ar), att.name);
      if (!pr.fileDate) pr.fileDate = best.date;
      parts.push({ label: best.tag, name: att.name, best, parsed: pr });
    }
    const parsed = parts.length === 1 ? Object.assign({}, parts[0].parsed, { errors: parts[0].parsed.errors.slice(), warnings: parts[0].parsed.warnings.slice() }) : Z.mergeParsed(parts);
    if (pick.missing.length) parsed.warnings.unshift('Não encontrei o relatório ' + pick.missing.join(' e ') + ' nas últimas mensagens. Ao aplicar, o stock fica só com ' + pick.found.map((b) => b.tag).join(' e ') + '.');
    if (auto && S.imp) { S.mail = { at: now, kind: 'ok', msg: 'Há uma importação por rever; não substituí a pré-visualização.' }; return render(); }
    const lastAt = pick.found.reduce((m, b) => (b.at > m ? b.at : m), '');
    S.imp = { parsed, fileName: parts.map((p) => p.name).join(' + '), fileDate: parsed.fileDate || newest, source: 'email', mailAt: lastAt };
    const desc = parts.map((p) => p.label + ' de ' + Z.fmtDate(p.best.date)).join(' e ');
    S.mail = { at: now, kind: parsed.ok && !pick.missing.length ? 'ok' : 'warn', msg: (pick.found.length > 1 ? 'Relatórios ' : 'Relatório ') + desc + (parsed.ok ? ' carregado' + (pick.found.length > 1 ? 's' : '') + ' para pré-visualização.' : ': há erros; veja abaixo.') + (pick.missing.length ? ' Falta o ' + pick.missing.join(' e ') + '.' : '') };
    if (auto && parsed.ok) {
      // Aplica sozinho só quando é seguro: todos os relatórios encontrados, sem erros e sem reservas a rever.
      const eff = Z.importEffects(S.orders, parsed.lines);
      const why = [];
      if (S.cfg.emailAutoAplicar === false) why.push('a aplicação automática está desligada nas Definições');
      if (pick.missing.length) why.push('falta o relatório ' + pick.missing.join(' e '));
      if (eff.warnings.length) why.push('há ' + eff.warnings.length + ' reserva(s) a rever');
      if (S.ui.busy) why.push('há outra operação em curso');
      if (!why.length) {
        const ok = await applyImport(true);
        S.mail = { at: now, kind: 'ok', msg: ok ? 'Relatórios ' + desc + ': stock atualizado automaticamente a partir do email. Próxima atualização ' + nextUpdateTxt() + '.' : 'O stock já tinha sido atualizado com estes relatórios.' };
      } else {
        S.mail.msg += ' Não apliquei sozinho porque ' + why.join(' e ') + ': reveja e carregue em Aplicar importação.';
        S.mail.kind = 'warn';
        toast('Chegaram os relatórios da Logifrio (' + desc + '). Reveja e aplique em Importar stock.');
      }
    }
  } catch (e) {
    const code = e && e.code;
    let m = MAIL_ERR[code];
    if (code === 'no_report') m = 'Não encontrei nenhum relatório diário ' + Z.reportTags(S.cfg).join(' nem ') + ' nas últimas mensagens da pasta ' + pasta + '.';
    else if (code === 'no_attachment') m = 'A mensagem "' + (e.subject || '') + '" não tem o anexo …_DailyReport.xlsx.';
    else if (code === 'tool_error') m = 'O Outlook recusou o pedido. Confirme que a pasta "' + pasta + '" existe na sua caixa de correio (Definições → Relatório diário por email). ' + ((e && e.message) || '');
    else if (!m) m = 'Não foi possível ler o email: ' + ((e && e.message) || e);
    S.mail = { at: now, kind: 'warn', msg: m };
    if (!auto) S.imp = null;
  } finally {
    if (S.mail) S.mail.busy = false;
    render();
  }
}
async function loadImportFile(files) {
  files = Array.isArray(files) ? files : [files];
  const names = files.map((f) => f.name).join(' + ');
  S.imp = { loading: true, fileName: names }; render();
  const parts = [];
  for (const file of files) {
    try {
      const buf = await file.arrayBuffer();
      const wb = new window.ExcelJS.Workbook(); await wb.xlsx.load(buf);
      parts.push({ label: files.length > 1 ? file.name : '', parsed: Z.parseStockWorkbook(wb, file.name) });
    } catch (e) { parts.push({ label: files.length > 1 ? file.name : '', parsed: { ok: false, errors: ['Não foi possível ler o ficheiro: ' + (e.message || e)], warnings: [], lines: [] } }); }
  }
  const parsed = parts.length === 1 ? parts[0].parsed : Z.mergeParsed(parts);
  S.imp = { parsed, fileName: names, fileDate: parsed.fileDate };
  render();
}
async function applyImport(auto) {
  const p = S.imp; if (!p || !p.parsed || !p.parsed.ok || !p.fileDate) return false;
  S.ui.busy = true; render();
  let got = false;
  for (let i = 0; i < 15 && !got; i++) { const r = await store.acquire(S.holder); got = r.acquired; if (!got) await new Promise((res) => setTimeout(res, 800)); }
  if (!got) { S.ui.busy = false; render(); if (!auto) toast('Há uma confirmação em curso. Tente de novo dentro de segundos.'); return false; }
  let done = false;
  try {
    if (auto) {
      // Outra pessoa pode ter aplicado o mesmo relatório entretanto.
      const ptr = await store.getPointer();
      if (ptr && ptr.fileDate && ptr.fileDate >= p.fileDate) { S.imp = null; return false; }
    }
    const id = 'imp-' + p.fileDate.replace(/-/g, '') + '-' + Z.uid('');
    const orders = await store.getOrders();
    const eff = Z.importEffects(orders, p.parsed.lines);
    const meta = { importId: id, fileName: p.fileName, fileDate: p.fileDate, importedAt: new Date().toISOString(), importedBy: S.me.id, auto: !!auto, rowCount: p.parsed.lines.length, consumed: eff.consume.length, warnings: eff.warnings.slice(0, 50) };
    await store.saveImport(id, meta, p.parsed.lines);
    const touched = {};
    for (const c of eff.consume) {
      const o = touched[c.orderId] || (touched[c.orderId] = orders.find((x) => x.id === c.orderId));
      o.lines.forEach((ln) => ln.allocations.forEach((a) => { if (a.id === c.allocId) { a.consumed = true; a.consumedAt = meta.importedAt; a.consumedImport = id; } }));
    }
    for (const oid in touched) {
      const o = touched[oid];
      const all = o.lines.every((ln) => ln.allocations.every((a) => a.consumed));
      Z.addHistory(o, S.me.id, 'Saída reconhecida na importação', 'Stock de ' + Z.fmtDate(p.fileDate) + ': ' + eff.consume.filter((c) => c.orderId === oid).map((c) => c.sscc + ' (' + c.boxes + ' cx)').join(', '));
      if (all) { o.state = 'concluida'; Z.addHistory(o, S.me.id, 'Concluída (expedida)', 'Todas as afetações saíram do stock; reservas libertadas.'); }
      o.updatedAt = new Date().toISOString(); o.rev = (o.rev || 0) + 1;
      await store.saveOrder(o);
    }
    await store.setPointer(meta);
    updateCatalog(p.parsed.lines);
    S.imp = null; done = true; toast('Stock de ' + Z.fmtDate(p.fileDate) + ' importado' + (auto ? ' automaticamente do email' : '') + '.' + (eff.consume.length ? ' ' + eff.consume.length + ' saídas reconhecidas.' : ''));
    refreshImports();
  } catch (e) { toast('A importação falhou: ' + (e.message || e.code || e)); }
  finally { try { await store.release(S.holder); } catch (e) {} S.ui.busy = false; render(); }
  return done;
}

function readSettings() {
  const c = clone(S.cfg);
  document.querySelectorAll('[data-cfg]').forEach((el) => {
    const k = el.dataset.cfg; let v = el.value;
    if (k === 'emailPara' || k === 'emailCc') v = emails(v);

    else if (k === 'emailHora') { const n = parseInt(v, 10); v = Number.isFinite(n) ? Math.min(23, Math.max(0, n)) : 8; }

    c[k] = v;
  });
  document.querySelectorAll('[data-cfgb]').forEach((el) => { c[el.dataset.cfgb] = el.checked; });
  c.motivosPermitidos = [...document.querySelectorAll('[data-motivo]')].filter((el) => el.checked).map((el) => el.dataset.motivo);
  return c;
}

    case 'cancel': {
      if (!S.ui.cancelArm) { S.ui.cancelArm = true; toast(o.state === 'enviada' ? 'Já foi enviada à Logifrio: avise-a do cancelamento. Carregue de novo para cancelar.' : 'Carregue de novo em "Cancelar encomenda" para confirmar.'); setTimeout(() => { S.ui.cancelArm = false; }, 5000); return; }
      S.ui.cancelArm = false; return transition('cancelar', 'Reservas libertadas' + (o.state === 'enviada' ? '. A Logifrio tem de ser avisada.' : ''));
    }
    case 'delete-order': return deleteCancelled(o);
    case 'faltas-per': S.ui.fPer = d.per; return render();
    case 'faltas-xlsx': return exportFaltas();
    case 'falta-del': { if (!confirm('Apagar este registo de falta?')) return; const id = t.dataset.falta; S.faltas = (S.faltas || []).filter((x) => x.id !== id); await store.deleteFalta(id); return render(); }
    case 'send-direct': return doSendDirect();
    case 'save-weights': { document.querySelectorAll('[data-weight]').forEach((el) => { o.lines.forEach((ln) => ln.allocations.forEach((a) => { if (a.id === el.dataset.weight) a.confirmedWeight = el.value === '' ? null : Math.round(+el.value * 1000) / 1000; })); }); Z.addHistory(o, S.me.id, 'Pesos confirmados registados', ''); S.dirty = true; await saveNow(); toast('Pesos guardados.'); return render(); }
    case 'gmail': return doGmail();
    case 'outlook': return doOutlook();
    case 'checkdraft': return checkOutlookDraft(S.edit, false);
    case 'download': return doDownload();
    case 'copy': return copyText(d.what);
    case 'reload-remote': S.edit = clone(S.remoteChanged); S.remoteChanged = null; S.ui.mail = null; return render();
    case 'apply-import': return applyImport();
    case 'discard-import': S.imp = null; return render();
    case 'apply-clients': return applyClients();
    case 'discard-clients': S.cimp = null; return render();
    case 'clear-client': { const o2 = S.edit; addHist(o2, 'Cliente retirado', o2.cliente); ['clienteId', 'clienteNumero', 'entrega', 'faturacao', 'clienteForaLista'].forEach((k) => { delete o2[k]; }); touch(true); return render(); }
    case 'sv-import': return loadStockVision();
    case 'mail-import': return checkMailReport(false);
    case 'export-data': return exportData();
    case 'recomecar': return recomecar();
    case 'prep-check': return checkPreparations(false);
    case 'prep-link': { const v = $('#prep-pick') && $('#prep-pick').value; if (!v) return toast('Escolha o relatório.'); await linkPrep(v, S.edit.id, false); return render(); }
    case 'prep-unlink': return unlinkPrep(t.dataset.prep);
    case 'prep-del': case 'prep-del-all': {
      const cand = S.orders.filter((x) => PREP_STATES.includes(x.state));
      const ids = d.act === 'prep-del' ? [t.dataset.prep] : (S.preps || []).filter((p) => !p.orderId && !p.ignorada && Z.matchPreparation(p, cand).plausible).map((p) => p.id);
      if (d.act === 'prep-del-all' && !confirm('Apagar ' + ids.length + ' relatório(s) da lista por associar?')) return;
      for (const id of ids) { const p = (S.preps || []).find((x) => x.id === id); if (p) { p.ignorada = true; delete p.sugestao; await store.savePrep(p); } }
      return render();
    }
    case 'prep-accept': return acceptPrep(S.edit);
    case 'prep-correct': return askCorrection(S.edit);
    case 'prep-finance': return sendFinance(S.edit);
    case 'save-perfil': return savePerfil();
    case 'ms-login': await loadMsIdentity(); if (!identity().ok) toast('Não foi possível ler a conta Microsoft 365. Confirme a ligação em claude.ai → Definições → Conectores.'); return;
    case 'save-cfg': { const c = readSettings(); try { await store.saveConfig(c); toast('Definições guardadas.'); } catch (e) { toast('Não foi possível guardar: sem permissão ou sem ligação.'); } return; }
    case 'reset-cfg': { try { await store.saveConfig(clone(Z.DEFAULT_CONFIG)); toast('Valores iniciais repostos.'); } catch (e) { toast('Não foi possível guardar.'); } return; }
  }
});
document.addEventListener('input', (ev) => {
  const el = ev.target; const d = el.dataset;
  if (d.field && S.edit && S.edit.state === 'rascunho') {
    S.edit[d.field] = el.value;
    if (d.field === 'dataEntrega' && !S.edit.dataExpedicao) { S.edit.dataExpedicao = el.value; const x = $('#f-dataExpedicao'); if (x) x.value = el.value; }
    touch(); return;
  }
  if (el.id === 'q') { S.ui.q = el.value; S.ui.pick = null; return render(); }
  if (el.id === 'cq') { S.ui.cq = el.value; return render(); }
  if (d.nc && S.ui.nc) { S.ui.nc[d.nc] = el.value; return; }
  if (el.id === 'clq') { S.ui.clq = el.value; return render(); }
  if (el.id === 'addqty') { S.ui.addQty = el.value; return; }
  if (d.adj !== undefined && S.ui.adjust) { S.ui.adjust.vals[d.adj] = el.value; const ln = S.edit.lines.find((l) => l.id === S.ui.adjust.lineId); const s = Object.values(S.ui.adjust.vals).reduce((a, b) => a + (+b || 0), 0); const t = $('#adjsum'); if (t) t.textContent = adjSumText(ln, s); return; }
  if (d.mail && S.ui.mail) { S.ui.mail[d.mail] = el.value; return; }
  if (el.id === 'stocksearch') { S.ui.stockSearch = el.value; return render(); }
  if (el.id === 'fq') { S.ui.fQ = el.value; return render(); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.field === 'dataExpedicao' || el.dataset.field === 'dataEntrega') { saveNow(); render(); }
  if (el.id === 'sentcheck') { S.ui.sentCheck = el.checked; render(); }
  if (el.id === 'adjqty' && S.ui.adjust) S.ui.adjust.changeQty = el.checked;
  if (el.id === 'nc-guardar' && S.ui.nc) S.ui.nc.guardar = el.checked;
  if (el.id === 'stocksort') { S.ui.stockSort = el.value; return render(); }
  if (el.id === 'fall') { S.ui.fAll = el.checked; return render(); }
  if (el.id === 'custodia') { saveCustoDia(el.value); return; }
  if (el.id === 'stockdate') { S.ui.stockDate = el.value || Z.isoToday(); render(); }
  if (el.id === 'impfile' && el.files && el.files[0]) loadImportFile([...el.files]);
  if (el.id === 'impdate' && S.imp) { S.imp.fileDate = el.value; render(); }
  if (el.dataset && el.dataset.preplink !== undefined && el.value) {
    const pid = el.dataset.preplink, v = el.value;
    if (v === '__ignorar') { const p = (S.preps || []).find((x) => x.id === pid); if (p) { p.ignorada = true; store.savePrep(p).then(render); } return; }
    linkPrep(pid, v, false).then(render); return;
  }
  if (el.id === 'importdata' && el.files && el.files[0]) { importData(el.files[0]); el.value = ''; return; }
  if (el.id === 'clifile' && el.files && el.files[0]) loadClientsFile(el.files[0]);
  if (el.dataset.morada && S.edit && S.edit.state === 'rascunho') { const prev = S.edit.local; S.edit.local = el.value; addHist(S.edit, 'Morada de entrega escolhida', prev + ' → ' + el.value); touch(true); render(); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.id === 'addqty') { ev.preventDefault(); addLine(); }
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.nc) { ev.preventDefault(); saveManualClient(); }
  if (ev.key === 'Enter' && ev.target.id === 'q') { const first = document.querySelector('[data-pick]'); if (first) { ev.preventDefault(); first.click(); } }
});
window.addEventListener('beforeunload', () => { if (S.dirty) saveNow(); });

boot();
})();

</script>

</body>
</html>
