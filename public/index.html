<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Encomendas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior fixa com estado do stock, navegação por separadores, área de trabalho de uma coluna que abre em duas no tablet/computador. */
:root {
  /* Identidade: True Born (preto, branco, dourado) e Monte do Pasto (verde #247305, letra Montserrat). */
  --bg: #F4F2ED; --surface: #FFFFFF; --sunk: #ECE8E0; --ink: #161616; --muted: #5F5A51; --line: #DCD6CA;
  --accent: #247305; --accent-ink: #FFFFFF; --accent-soft: #E3EFD9;
  --ok: #256E09; --ok-soft: #E3EFD9; --warn: #8A5A00; --warn-soft: #F8ECD2; --bad: #8E1E1E; --bad-soft: #F6DEDB;
  --gold: #C9A24A; --gold-ink: #85601C; --hdr: #0B0B0B;
  --f-display: "Montserrat", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Montserrat", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C0C0C; --surface: #171717; --sunk: #111111; --ink: #EDEAE4; --muted: #A39E94; --line: #2B2925;
  --accent: #6CC24A; --accent-ink: #0B1A05; --accent-soft: #1C2E14;
  --ok: #7BCB57; --ok-soft: #17280F; --warn: #E6B04F; --warn-soft: #2F240F; --bad: #F08A7E; --bad-soft: #361414;
  --gold: #C9A24A; --gold-ink: #D9AE55; --hdr: #000000; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0C0C0C; --surface: #171717; --sunk: #111111; --ink: #EDEAE4; --muted: #A39E94; --line: #2B2925;
  --accent: #6CC24A; --accent-ink: #0B1A05; --accent-soft: #1C2E14;
  --ok: #7BCB57; --ok-soft: #17280F; --warn: #E6B04F; --warn-soft: #2F240F; --bad: #F08A7E; --bad-soft: #361414;
  --gold: #C9A24A; --gold-ink: #D9AE55; --hdr: #000000; color-scheme: dark }
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font: 15.5px/1.5 var(--f-body); margin: 0; -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); margin: 0 auto }
@media (min-width: 1200px) { .wrap { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)) } }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--hdr); border-bottom: 3px solid var(--gold); color: #fff;
  /* cores dentro da barra preta da marca */
  --ink: #FFFFFF; --muted: #BDB7AB; --sunk: rgba(255,255,255,.09); --line: rgba(255,255,255,.16); --accent: var(--gold); --warn: #E6B04F; color-scheme: dark }
body::before { background: var(--hdr) !important }
.brand-tb { height: 44px; width: auto; display: block }
.brand-sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.22) }
.brand-txt { display: flex; flex-direction: column; gap: 3px }
.brand-mdp { height: 26px; width: auto; display: block; opacity: .95 }
.nav-row { display: flex; align-items: center; gap: 16px }
.nav-row nav.tabs { flex: 1 1 auto; min-width: 0 }
@media (max-width: 900px) { .brand-mdp { display: none } }
@media (max-width: 640px) { .brand-tb { height: 34px } .brand-txt small { display: none } }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px }
.brand { font: 800 19px/1.1 var(--f-display); letter-spacing: -.005em; display: flex; align-items: center; gap: 14px; color: #fff }
.brand { flex-wrap: wrap }
.brand small { font: 600 11px var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold) }
.stockchip { display: block; font-size: 13px; color: var(--muted); background: var(--sunk); border-radius: 999px; padding: 4px 12px; margin-left: auto }
.stockchip b { color: var(--ink); font-weight: 600 }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none }
nav.tabs button { border: 0; background: none; font: 600 15px var(--f-body); color: var(--muted); padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; min-height: 44px }
nav.tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent) }
main { padding-block: 20px 120px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0 }
h1 { font-size: 28px; font-weight: 800; letter-spacing: .005em }
h2 { font-size: 20px; font-weight: 700 }
h3 { font-size: 16px; font-weight: 700 }
.eyebrow { font: 700 11px var(--f-display); text-transform: uppercase; letter-spacing: .14em; color: var(--gold-ink) }
.muted { color: var(--muted) }
.stack { display: flex; flex-direction: column; gap: 16px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.between { justify-content: space-between }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr }
.grid2 > * { min-width: 0 }
/* Encomenda: dados à esquerda com largura fixa, artigos e SSCC ocupam o resto da janela; abaixo de 1100px fica numa coluna. */
@media (min-width: 1100px) { .grid2 { grid-template-columns: clamp(320px, 26vw, 440px) minmax(0, 1fr) } }
@media (max-width: 1180px) { table { font-size: 13px } th, td { padding: 6px 6px } .sscc { font-size: 12.5px } }
.fields { display: grid; gap: 12px; grid-template-columns: 1fr }
@media (min-width: 560px) { .fields { grid-template-columns: 1fr 1fr } .fields .full { grid-column: 1 / -1 } }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600; color: var(--muted); min-width: 0 }
input, select, textarea { font: 16px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 11px; min-height: 44px; width: 100%; min-width: 0 }
textarea { min-height: 76px; resize: vertical }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input[readonly], textarea[readonly] { background: var(--sunk) }
.btn { font: 600 15px var(--f-body); border-radius: var(--r); padding: 10px 16px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 700 12px var(--f-display); letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.s-rascunho { background: var(--sunk); color: var(--muted) }
.s-confirmada { background: var(--accent-soft); color: var(--accent) }
.s-preparada { background: var(--warn-soft); color: var(--warn) }
.s-enviada { background: var(--ok-soft); color: var(--ok) }
.s-concluida { background: var(--sunk); color: var(--ok) }
.s-cancelada { background: var(--bad-soft); color: var(--bad) }
.st-elegivel { color: var(--ok); background: var(--ok-soft) }
.st-bloqueado { color: var(--bad); background: var(--bad-soft) }
.st-expirado { color: var(--bad); background: var(--bad-soft) }
.st-rever { color: var(--warn); background: var(--warn-soft) }
.note { border-radius: var(--r); padding: 10px 14px; font-size: 15px; border: 1px solid }
.note.info { background: var(--accent-soft); border-color: transparent; color: var(--ink) }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink) }
.note.bad { background: var(--bad-soft); border-color: transparent; color: var(--ink) }
.note.ok { background: var(--ok-soft); border-color: transparent; color: var(--ink) }
.note ul { margin: 6px 0 0; padding-left: 20px }
.sscc { font: 500 13.5px var(--f-mono); white-space: nowrap; letter-spacing: 0 }
.sscc i { font-style: normal; color: var(--muted); font-size: 11.5px; margin-right: 4px }
.sscc em { font-style: normal; margin-left: 2px; padding-left: 2px; border-left: 1px solid var(--line) }
.mono { font-family: var(--f-mono); font-size: 14px }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r) }
table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface) }
th { text-align: left; font: 700 11px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); padding: 8px 8px; white-space: nowrap }
th:first-child, td:first-child { padding-left: 12px }
th:last-child, td:last-child { padding-right: 12px }
td { padding: 8px 8px; border-top: 1px solid var(--line); vertical-align: top }
.c-wrap { min-width: 9em; overflow-wrap: anywhere }
.dates { display: flex; flex-wrap: wrap; gap: 0 10px; font-variant-numeric: tabular-nums }
.dates span { white-space: nowrap }
/* Cartão do cliente: 2 colunas quando há espaço, 1 coluna na coluna estreita da encomenda. */
.cinfo { display: grid; gap: 12px 20px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)) }
.cinfo > * { min-width: 0; overflow-wrap: anywhere }
.c-why { min-width: 11em }
.qtyin { min-height: 36px; padding: 6px 8px }
tr.dim td { color: var(--muted) }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px }
.kpi b { display: block; font: 800 26px var(--f-display); font-variant-numeric: tabular-nums }
.kpi span { font-size: 13px; color: var(--muted) }
.kg-big { font-size: 14px; color: var(--muted) }
table.arts tr.art-row { cursor: pointer }
table.arts tr.art-row:hover td, table.arts tr.art-row:focus-visible td { background: var(--accent-soft) }
table.arts tr.art-row.open td { background: var(--sunk); border-bottom: 0 }
.art-caret { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; margin-right: 4px }
tr.art-row.open .art-caret { transform: rotate(90deg); color: var(--accent) }
tr.art-detail > td { padding: 0 8px 12px 26px; background: var(--sunk); border-top: 0 }
tr.art-detail .tbl-wrap { background: var(--surface) }
.kg-big b { font: 800 24px var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 4px }
tr.kg-total td { border-top: 2px solid var(--ink); background: var(--sunk) }
.olist { display: flex; flex-direction: column; gap: 8px }
.ocard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100% }
.ocard:hover { border-color: var(--accent) }
.ocard .ref { font: 700 16px var(--f-mono) }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font: 600 14px var(--f-body); color: var(--muted); cursor: pointer; min-height: 36px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.line-card { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
.line-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line) }
.line-head .art { font: 700 15px var(--f-mono) }
.line-head .nm { flex: 1 1 220px; min-width: 0 }
.line-head .qty { font: 800 22px var(--f-display); font-variant-numeric: tabular-nums; margin-left: auto }
.line-head .qty small { font: 600 13px var(--f-body); color: var(--muted) }
.line-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px }
.why { font-size: 13px; color: var(--muted) }
.results { border: 1px solid var(--line); border-radius: var(--r); max-height: 320px; overflow: auto; background: var(--surface) }
.results button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; min-height: 44px; align-items: center }
.results button:first-child { border-top: 0 }
.results button:hover, .results button[aria-selected="true"] { background: var(--accent-soft) }
.results .avail { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px) }
.actionbar .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px }
.actionbar .grow { flex: 1 1 200px; min-width: 0; font-size: 14px; color: var(--muted) }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px }
.hist li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px }
.hist time { color: var(--muted); font-variant-numeric: tabular-nums }
.temp { font: 700 12px var(--f-mono); color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 2px 6px; white-space: nowrap }
.empty { text-align: center; padding: 40px 16px; color: var(--muted) }
.empty h2 { color: var(--ink); margin-bottom: 6px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: var(--r); font-weight: 600; max-width: calc(100% - 32px) }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px }
.check input { width: 22px; min-height: 22px; height: 22px; flex: none; margin-top: 1px }
.qtyin { width: 96px; text-align: right; font-variant-numeric: tabular-nums }
pre.mail { white-space: pre-wrap; font: 14px/1.5 var(--f-body); background: var(--sunk); border-radius: var(--r); padding: 12px; margin: 0; max-height: 320px; overflow: auto }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .ocard { transition: border-color .15s, background .15s } }
.themebtn { flex: none; width: 40px; height: 40px; min-height: 40px; padding: 0; justify-content: center; border-radius: 999px; background: var(--sunk); border-color: transparent; color: var(--ink) }
.themebtn svg { width: 20px; height: 20px }
@media (max-width: 640px) { .top-row .brand { flex: 1 1 0; min-width: 0 } .themebtn { order: 1 } .stockchip { order: 2; margin-left: 0 } }
.themebtn .i-sun { display: none }
:root[data-theme="dark"] .themebtn .i-sun { display: block }
:root[data-theme="dark"] .themebtn .i-moon { display: none }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .themebtn .i-sun { display: block } :root:not([data-theme="light"]) .themebtn .i-moon { display: none } }
/* Aviso de atualização do stock na primeira abertura do dia. */
.upd { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(2px) }
.upd-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); padding: 24px 26px; max-width: 420px; width: 100%; display: flex; gap: 16px; align-items: flex-start }
.upd-card h2 { margin-bottom: 4px }
.upd-card p { margin: 0; color: var(--muted); font-size: 15px }
.spin { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 0.9s linear infinite; margin-top: 2px }
@keyframes spin { to { transform: rotate(360deg) } }
.upd[hidden] { display: none }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s } }
/* Calendário para os campos de data (abre ao clicar; no telemóvel usa o calendário do sistema). */
.dp { position: fixed; z-index: 30; width: 296px; max-width: calc(100vw - 16px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 10px }
.dp-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px }
.dp-head b { font: 700 15px var(--f-display); text-transform: capitalize }
.dp-nav { border: 0; background: none; color: var(--ink); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 20px; line-height: 1 }
.dp-nav:hover { background: var(--sunk) }
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center }
.dp-grid span { font: 700 11px var(--f-display); color: var(--muted); text-transform: uppercase; padding: 4px 0 }
.dp-grid button { border: 0; background: none; color: var(--ink); height: 36px; border-radius: 8px; font: 500 14px var(--f-body); font-variant-numeric: tabular-nums; cursor: pointer }
.dp-grid button:hover { background: var(--accent-soft) }
.dp-grid button.out { color: var(--muted); opacity: .55 }
.dp-grid button.today { box-shadow: inset 0 0 0 1px var(--accent) }
.dp-grid button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink) }
.dp-grid button:disabled { opacity: .25; cursor: not-allowed; background: none }
.dp-foot { display: flex; justify-content: space-between; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px }
.dp-foot button { border: 0; background: none; color: var(--accent); font: 600 14px var(--f-body); padding: 6px 8px; border-radius: 6px; cursor: pointer }
.dp-foot button:hover { background: var(--sunk) }
@media (pointer: fine) { input[type="date"]:not([readonly]):not(:disabled) { cursor: pointer } }
</style>
<script src="config.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script src="platform.js"></script>
</head>
<body>


<header class="top">

<script>
/* Calendário: clicar num campo de data abre um calendário para escolher o dia, sem escrever.
 * Em ecrãs táteis o browser já abre o seu próprio calendário. Continua a ser possível escrever com o teclado. */
(function () {
  var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  var pop = null, target = null, view = null;
  var p2 = function (n) { return String(n).padStart(2, '0'); };
  var iso = function (y, m, d) { return y + '-' + p2(m + 1) + '-' + p2(d); };
  var todayIso = function () { var t = new Date(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); };
  function close() { if (pop) { pop.remove(); pop = null; target = null; } }
  function pick(v) {
    var el = target; close(); if (!el) return;
    el.value = v;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function draw() {
    var y = view.y, m = view.m, sel = target.value, hoje = todayIso(), min = target.min || '', max = target.max || '';
    var first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, start = new Date(y, m, 1 - off);
    var h = '<div class="dp-head"><button type="button" class="dp-nav" data-dp="prev" aria-label="Mês anterior">‹</button><b>' + MESES[m] + ' ' + y + '</b><button type="button" class="dp-nav" data-dp="next" aria-label="Mês seguinte">›</button></div><div class="dp-grid">';
    DIAS.forEach(function (d) { h += '<span>' + d + '</span>'; });
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), v = iso(d.getFullYear(), d.getMonth(), d.getDate());
      var cls = (d.getMonth() !== m ? 'out ' : '') + (v === hoje ? 'today' : '');
      var dis = (min && v < min) || (max && v > max);
      h += '<button type="button" data-dpv="' + v + '" class="' + cls + '"' + (v === sel ? ' aria-selected="true"' : '') + (dis ? ' disabled' : '') + '>' + d.getDate() + '</button>';
    }
    h += '</div><div class="dp-foot"><button type="button" data-dp="clear">Limpar</button><button type="button" data-dp="today">Hoje</button></div>';
    pop.innerHTML = h;
  }
  function place() {
    var r = target.getBoundingClientRect(), w = pop.offsetWidth, ht = pop.offsetHeight;
    var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    var top = r.bottom + 6; if (top + ht > window.innerHeight - 8 && r.top - ht - 6 > 8) top = r.top - ht - 6;
    pop.style.left = left + 'px'; pop.style.top = Math.max(8, top) + 'px';
  }
  function open(el) {
    close(); target = el;
    var v = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : todayIso();
    view = { y: +v.slice(0, 4), m: +v.slice(5, 7) - 1 };
    pop = document.createElement('div'); pop.className = 'dp'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Escolher data');
    document.body.appendChild(pop); draw(); place();
  }
  var fine = window.matchMedia && matchMedia('(pointer: fine)').matches;
  document.addEventListener('mousedown', function (ev) {
    var el = ev.target;
    if (pop && pop.contains(el)) { ev.preventDefault(); return; }
    if (fine && el.matches && el.matches('input[type="date"]') && !el.readOnly && !el.disabled) {
      ev.preventDefault();
      if (target === el) { close(); return; }
      el.focus({ preventScroll: true }); open(el); return;
    }
    close();
  }, true);
  document.addEventListener('click', function (ev) {
    if (!pop || !pop.contains(ev.target)) return;
    var b = ev.target.closest('button'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-dp'), v = b.getAttribute('data-dpv');
    if (v) return pick(v);
    if (a === 'prev') { view.m--; if (view.m < 0) { view.m = 11; view.y--; } draw(); }
    else if (a === 'next') { view.m++; if (view.m > 11) { view.m = 0; view.y++; } draw(); }
    else if (a === 'today') pick(todayIso());
    else if (a === 'clear') pick('');
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && pop) close(); });
  window.addEventListener('resize', close);
  window.addEventListener('scroll', function () { if (pop) place(); }, true);
})();
</script>

  const HEADER_MAP = {

  /** Lê a folha STOCK de um workbook ExcelJS já carregado. */

    const sheetName = ((opts && opts.sheetName) || 'STOCK').trim().toUpperCase();

  /** Lê linhas já extraídas (1.ª linha = cabeçalhos). Valores: texto, número, Date ou células ExcelJS. */
  function parseStockRows(rows, sheetLabel, fileName) {
    const errors = []; const warnings = [];
    const cols = {};
    (rows[0] || []).forEach((v, i) => {
      const h = cellText(v).text.trim().toLowerCase();
      if (HEADER_MAP[h]) cols[HEADER_MAP[h]] = i + 1;
    });
    const missing = REQUIRED.filter((k) => !cols[k]);
    const NAMES = { sscc: 'SSCC', article: 'Article Code', boxes: '#Boxes', bbd: 'BBD', lot: 'Lot Code', blocked: 'BlockedReasonCode', motivo: 'MotivoBloqueio' };

      const boxes = num(get('boxes'));
      if (!(Number.isInteger(boxes) && boxes > 0)) flags.push({ code: 'caixas', msg: 'N.º de caixas inválido' });
      const lot = get('lot').text.trim();

  // ---------- relatório diário recebido por email (conector Microsoft 365) ----------
  /* Junta as mensagens (objetos com 'subject') de uma resposta de pesquisa ou leitura de email. */
  function mailItems(res) {
    const out = []; const seen = {};
    const parseText = (t) => { try { return JSON.parse(t); } catch (e) { try { return JSON.parse('[' + t.replace(/}\s*{"/g, '},{"') + ']'); } catch (e2) { return null; } } };
    const walk = (v, d) => {
      if (!v || d > 6) return;
      if (typeof v === 'string') return walk(parseText(v), d + 1);
      if (Array.isArray(v)) return v.forEach((x) => walk(x, d + 1));
      if (typeof v !== 'object') return;
      if (typeof v.subject === 'string') { const k = v.id || v.uri || JSON.stringify(v).slice(0, 200); if (!seen[k]) { seen[k] = 1; out.push(v); } return; }
      if (v.type === 'text' && typeof v.text === 'string') return walk(v.text, d + 1);
      Object.keys(v).forEach((k) => { if (v[k] && typeof v[k] === 'object') walk(v[k], d + 1); });
    };
    if (res && Array.isArray(res.content)) { res.content.forEach((c) => walk(c, 0)); if (res.structuredContent) walk(res.structuredContent, 0); }
    else walk(res, 0);
    return out;
  }
  /* Texto completo de uma resposta (todos os blocos de texto). */
  function resultText(res) {
    if (typeof res === 'string') return res;
    if (res && Array.isArray(res.content)) return res.content.filter((c) => c && c.type === 'text' && typeof c.text === 'string').map((c) => c.text).join('\n');
    if (res && typeof res.payload === 'string') return res.payload;
    return '';
  }
  /* Escolhe o relatório diário mais recente (FRZ) entre as mensagens. */
  function pickDailyReport(items, cfg) {
    const sub = String((cfg && cfg.emailAssuntoZolve) || '').trim().toLowerCase();
    const from = String((cfg && cfg.emailRemetenteZolve) || '').trim().toLowerCase();
    const cand = items.filter((m) => {
      const s = String(m.subject || '').toLowerCase();
      if (!/relat[oó]rio di[aá]rio/.test(s)) return false;
      if (sub && !s.includes(sub)) return false;
      const snd = String(m.sender && typeof m.sender === 'object' ? m.sender.address || '' : m.sender || '').toLowerCase();
      if (from && snd && !snd.includes(from)) return false;
      return m.hasAttachments !== false;
    }).map((m) => {
      const mm = String(m.subject).match(/\((\d{4}-\d{2}-\d{2})\)/);
      return { msg: m, date: mm ? mm[1] : String(m.receivedDateTime || '').slice(0, 10), at: m.receivedDateTime || '' };
    });
    cand.sort((a, b) => (a.date === b.date ? (a.at < b.at ? 1 : -1) : (a.date < b.date ? 1 : -1)));

  }
  /* Etiquetas de assunto configuradas (separadas por ; ou ,). Uma configuração antiga só com "(FRZ)" passa a incluir "(FRE)". */
  function reportTags(cfg) {
    const raw = String((cfg && cfg.emailAssuntoZolve) || '').trim();
    // Aceita "(FRZ); (FRE)", "(FRZ) ou (FRE)", "(FRZ), (FRE)", "FRZ e FRE"…
    let tags = raw.match(/\([^()]+\)/g) || [];
    if (!tags.length) tags = raw.split(/\s*(?:[;,/+|]|\s+ou\s+|\s+e\s+)\s*/i).map((t) => t.trim()).filter(Boolean);
    tags = tags.map((t) => t.trim());
    if (tags.length === 1 && tags[0].toUpperCase() === '(FRZ)') tags.push('(FRE)');
    return tags.length ? tags : [''];
  }
  /* O relatório mais recente de cada etiqueta (FRZ, FRE, …). Devolve [{tag, msg, date, at}] só das que existem, e as que faltam. */
  function pickDailyReports(items, cfg) {
    const found = [], missing = [];
    for (const tag of reportTags(cfg)) {
      const best = pickDailyReport(items, Object.assign({}, cfg, { emailAssuntoZolve: tag }));
      if (best) found.push(Object.assign({ tag }, best)); else missing.push(tag);
    }

  /* Junta várias leituras da folha STOCK (ex.: FRZ + FRE) numa só importação. */

    const seen = {};
    for (const p of parts) {
      const tag = p.label ? p.label + ': ' : '';
      (p.parsed.errors || []).forEach((e) => out.errors.push(tag + e));
      (p.parsed.warnings || []).forEach((w) => out.warnings.push(tag + w));
      if (!p.parsed.ok) out.ok = false;
      for (const l of p.parsed.lines || []) {
        const k = lineKey(l);
        if (seen[k]) { const f = { code: 'duplicado', msg: 'Linha repetida em dois relatórios (mesmo SSCC, artigo e lote)' }; l.flags.push(f); seen[k].flags.push(f); } else seen[k] = l;
        out.lines.push(l);

  /* O anexo .xlsx do relatório numa mensagem lida com read_resource. */
  function reportAttachment(msg) {
    const at = ((msg && msg.attachments) || []).filter((a) => a && !a.isInline && /\.xlsx$/i.test(a.name || ''));
    return at.find((a) => /dailyreport/i.test(a.name)) || at[0] || null;

  /* Lê a folha pedida do texto devolvido pelo conector ("=== Sheet: NOME ===" e linhas separadas por tabulações). */
  function stockRowsFromText(text, sheetName) {
    const want = '=== SHEET: ' + String(sheetName || 'STOCK').trim().toUpperCase() + ' ===';
    const lines = String(text || '').split(/\r?\n/);
    const i = lines.findIndex((l) => l.trim().toUpperCase() === want);
    if (i < 0) return { rows: null, sheets: lines.filter((l) => /^=== Sheet: .* ===$/.test(l.trim())).map((l) => l.trim().slice(10, -4)) };
    const rows = []; let closed = false;
    for (let k = i + 1; k < lines.length; k++) {
      if (/^=== Sheet: .* ===$/.test(lines[k].trim())) { closed = true; break; }
      rows.push(lines[k].split('\t'));
    }
    while (rows.length && rows[rows.length - 1].every((c) => c.trim() === '')) rows.pop();
    return { rows, closed };

  function parseStockText(text, fileName) {

    const r = stockRowsFromText(t, 'STOCK');

  // ---------- elegibilidade, reservas, disponibilidade ----------
  function reviewFlags(line, cfg) {

  /** Estado de uma linha de stock para uma data de expedição. */
  function eligibility(line, shipDate, cfg) {

    }
    if (line.bbd && shipDate && line.bbd < addDays(shipDate, cfg.diasMinValidade || 0)) {
      return { status: 'expirado', reason: 'Validade ' + fmtDate(line.bbd) + ' não serve para expedição a ' + fmtDate(shipDate) };
    }
    const f = reviewFlags(line, cfg);
    if (f.length) return { status: 'rever', reason: f.map((x) => x.msg).join('; ') };
    if (line.boxes <= 0) return { status: 'rever', reason: 'Sem caixas' };
    return { status: 'elegivel', reason: line.blocked ? 'Elegível (motivo "' + line.motivo + '" aceite nas Definições)' : 'Elegível' };
  }

  /** Caixas reservadas por chave, por encomendas ativas (exceto excludeId). */
  function reservedMap(orders, excludeId) {
    const m = {};
    for (const o of orders) {
      if (o.id === excludeId || !ACTIVE_STATES.includes(o.state)) continue;
      for (const ln of o.lines || []) for (const a of ln.allocations || []) {
        if (a.consumed) continue;
        m[a.key] = (m[a.key] || 0) + a.boxes;
      }
    }
    return m;
  }
  function stockView(lines, orders, shipDate, cfg, excludeId) {
    const res = reservedMap(orders, excludeId);
    return lines.map((l) => {
      const e = eligibility(l, shipDate, cfg);
      const key = lineKey(l); const reserved = res[key] || 0;
      return Object.assign({}, l, { key, reserved, available: Math.max(0, l.boxes - reserved), status: e.status, reason: e.reason });

  function sortCandidates(arr, cfg) {
    const byB = (a, b) => (a.bbd < b.bbd ? -1 : a.bbd > b.bbd ? 1 : 0);

    return arr.slice().sort((a, b) => (cfg.estrategia === 'FIFO' ? (byE(a, b) || byB(a, b)) : (byB(a, b) || byE(a, b))) || (a.sscc < b.sscc ? -1 : 1));

  /** Proposta automática para um artigo. takenInOrder: caixas já usadas por outras linhas da mesma encomenda. */
  function suggest(article, qty, view, cfg, takenInOrder) {
    takenInOrder = takenInOrder || {};
    const all = view.filter((l) => l.article === article);
    const eligible = sortCandidates(all.filter((l) => l.status === 'elegivel'), cfg)
      .map((l) => Object.assign({}, l, { free: Math.max(0, l.available - (takenInOrder[l.key] || 0)) }))
      .filter((l) => l.free > 0);
    const allocations = []; let remaining = qty;
    const crit = cfg.estrategia === 'FIFO' ? 'FIFO: entrada mais antiga' : 'FEFO: validade mais próxima';
    for (const l of eligible) {
      if (remaining <= 0) break;
      if (!cfg.pickingParcial && l.free > remaining) continue;
      if (!cfg.pickingParcial && l.free < l.boxes) continue;
      const take = Math.min(l.free, remaining);
      allocations.push(makeAlloc(l, take, 'auto', crit + (allocations.length ? ' (seguinte disponível)' : '')));
      remaining -= take;
    }
    const excluded = all.filter((l) => l.status !== 'elegivel');
    return {
      allocations, shortfall: Math.max(0, remaining),
      totalFree: eligible.reduce((s, l) => s + l.free, 0),

  function makeAlloc(l, boxes, source, why) {

      entryDate: l.entryDate, warehouse: l.warehouse, zone: l.zone, boxes,
      ssccBoxes: l.boxes, ssccWeight: l.weight, source, why

  }
  /** Peso de uma afetação: confirmado > registado (SSCC inteiro) > estimado (só em pedidos em kg) > a confirmar. */
  function allocWeight(a) {

  /** Valida a encomenda contra o stock atual e as reservas das outras encomendas. */

  /** Efeitos de uma nova importação nas reservas ativas. Não altera nada: devolve o que fazer. */

  // ---------- FM.01107: preenchido sobre o ficheiro original da Monte do Pasto ----------
  // O modelo é o próprio ficheiro "FM.01107.PEDIDO_SAIDA_STOCK" (só sem as linhas vazias formatadas no fim).
  // Mantém-se tudo: estilos, logótipo no cabeçalho da página, rodapé "FM.01107.01 Página x de y", margens,
  // escala de impressão e vista. Só se trocam valores: cabeçalho (data, assunto, contactos alterados nas
  // Definições) e uma linha por SSCC, com os estilos das linhas de dados do original (1.ª linha = linha 17,
  // seguintes = linha 18). As linhas de fecho do quadro (22 em diante) vêm logo a seguir aos dados.
  const xmlEsc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const HEADER_CELLS = [

    const re = new RegExp('<c r="' + ref + '"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');
    const m = rowXml.match(re);
    if (!m) throw new Error('Modelo FM.01107: falta a célula ' + ref);
    const sAttr = (m[1].match(/ s="\d+"/) || [''])[0];

  async function buildFM01107(JSZip, templateBuf, order, cfg, nowIso) {

    nums.filter((r) => r < 17).forEach((r) => { header[r] = rows[r]; });

  /** Relê o .xlsx gerado e confere totais e identificadores. */
  async function verifyWorkbook(ExcelJS, buf, order, cfg) {

    const sure = plausible && best.s.score >= 0.6 && (!second || second.s.score < 0.45 || best.s.score - second.s.score >= 0.15);
    return { best: best || null, candidates: c.slice(0, 5), sure, plausible };
  }
  /* Usa só o relatório mais recente de cada referência da Logifrio (uma correção substitui a anterior). */
  function latestPreps(preps) {
    const by = {};
    for (const p of preps || []) { const k = (p.zona || '') + '|' + normTxt(p.zolveRef); if (!by[k] || (p.receivedAt || '') > (by[k].receivedAt || '')) by[k] = p; }
    return Object.values(by);
  }
  /* Compara a encomenda com a preparação: caixas por artigo, lotes e peso. */
  function comparePreparation(order, preps) {
    const use = latestPreps(preps);
    const picked = {};
    for (const p of use) for (const l of p.lines || []) {
      const a = picked[l.article] || (picked[l.article] = { cases: 0, pieces: 0, kg: 0, lots: {}, name: l.name, bbd: [] });
      a.cases += l.cases; a.pieces += l.pieces; a.kg = round3(a.kg + (l.weight || 0));
      if (l.lot) a.lots[l.lot.toUpperCase()] = (a.lots[l.lot.toUpperCase()] || 0) + l.cases;
      if (l.bbd) a.bbd.push(l.bbd);
    }
    const errors = [], warnings = [], rows = [];
    const seen = {};
    for (const ln of order.lines || []) {
      const a = seen[ln.article] || (seen[ln.article] = { article: ln.article, name: ln.name, qty: 0, qtyKg: 0, kgLine: false, lots: {} });
      a.qty += ln.qty || 0; if (ln.unit === 'kg') { a.kgLine = true; a.qtyKg += ln.qtyKg || 0; }
      for (const al of ln.allocations || []) if (al.lot) a.lots[String(al.lot).toUpperCase()] = (a.lots[String(al.lot).toUpperCase()] || 0) + al.boxes;
    }
    for (const art of Object.keys(seen)) {
      const e = seen[art], p = picked[art];
      const r = { article: art, name: e.name || (p && p.name) || '', pedidoCx: e.qty, prepCx: p ? p.cases : 0, pedidoKg: e.kgLine ? round3(e.qtyKg) : null, prepKg: p ? p.kg : 0, lotsPedido: Object.keys(e.lots), lotsPrep: p ? Object.keys(p.lots) : [], problemas: [] };
      if (!p) r.problemas.push('Não foi preparado');
      else {
        if (p.cases !== e.qty) r.problemas.push('Caixas: pedido ' + e.qty + ', preparado ' + p.cases);
        const extra = r.lotsPrep.filter((l) => !e.lots[l]);
        if (extra.length && r.lotsPedido.length) r.problemas.push('Lote diferente do pedido: ' + extra.join(', ') + ' (pedido: ' + r.lotsPedido.join(', ') + ')');
        if (e.kgLine && e.qtyKg > 0 && p.kg > 0 && Math.abs(p.kg - e.qtyKg) > e.qtyKg * 0.1) warnings.push(art + ': pedido ' + fmtKg(e.qtyKg) + ', preparado ' + fmtKg(p.kg) + ' (diferença acima de 10%).');
        const val = (p.bbd || []).filter((b) => order.dataEntrega && b < order.dataEntrega);
        if (val.length) r.problemas.push('Validade ' + val.map(fmtDate).join(', ') + ' anterior à data de entrega');
      }
      r.problemas.forEach((x) => errors.push(art + ': ' + x));
      r.ok = !r.problemas.length; rows.push(r);
    }
    for (const art of Object.keys(picked)) if (!seen[art]) {
      const p = picked[art];
      rows.push({ article: art, name: p.name, pedidoCx: 0, prepCx: p.cases, pedidoKg: null, prepKg: p.kg, lotsPedido: [], lotsPrep: Object.keys(p.lots), problemas: ['Preparado mas não pedido'], ok: false });
      errors.push(art + ': preparado mas não está na encomenda (' + p.cases + ' cx)');
    }
    const totalCx = rows.reduce((t, r) => t + r.prepCx, 0), totalKg = round3(rows.reduce((t, r) => t + (r.prepKg || 0), 0));
    return { ok: errors.length === 0 && use.length > 0, errors, warnings, rows, totalCx, totalKg, refs: use.map((p) => p.zolveRef + (p.zona ? ' (' + p.zona + ')' : '')), datas: [...new Set(use.map((p) => p.date))] };
  }
  /* Email para o Financeiro com o que saiu do armazém (para faturar). */
  function financeEmail(order, preps, cmp, cfg) {
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const f = order.faturacao || {};
    const use = latestPreps(preps);
    const linhas = [];
    for (const p of use) for (const l of p.lines || []) linhas.push(l);
    const subject = 'Faturação - ' + String(order.cliente || '').trim() + ' - ' + order.ref + ' (preparado a ' + cmp.datas.map(fmtDate).join(', ') + ')';
    const td = (v, r) => '<td' + (r ? ' style="text-align:right"' : '') + '>' + esc(v) + '</td>';
    const html = '<p>' + esc(salutation(cfg)) + '</p>' +
      '<p>A encomenda <b>' + esc(order.ref) + '</b> foi preparada pela Logifrio e confere com o pedido' + (order.prep && order.prep.aceite ? ' (corrigida para as quantidades preparadas)' : '') + '. Seguem os dados para faturação.</p>' +
      '<table border="1" cellpadding="4" cellspacing="0"><tbody>' +
      '<tr><th align="left">Cliente</th><td>' + esc(order.cliente) + (order.clienteNumero ? ' (n.º ' + esc(order.clienteNumero) + ')' : '') + '</td></tr>' +
      '<tr><th align="left">Empresa / NIF</th><td>' + esc([f.empresa, f.nif].filter(Boolean).join(' · ') || '—') + '</td></tr>' +
      '<tr><th align="left">Morada fiscal</th><td>' + esc(f.morada || '—') + '</td></tr>' +
      '<tr><th align="left">Email de faturação</th><td>' + esc(f.email || '—') + '</td></tr>' +
      '<tr><th align="left">Condição de pagamento</th><td>' + esc(f.condicaoPagamento || '—') + '</td></tr>' +
      '<tr><th align="left">Local de entrega</th><td>' + esc(order.local) + '</td></tr>' +
      '<tr><th align="left">Data de entrega</th><td>' + esc(fmtDate(order.dataEntrega)) + '</td></tr>' +
      '<tr><th align="left">Preparação Logifrio</th><td>' + esc(cmp.refs.join(', ')) + '</td></tr></tbody></table>' +
      '<p><b>Produto preparado</b></p>' +
      '<table border="1" cellpadding="4" cellspacing="0"><thead><tr><th>Artigo</th><th>Descrição</th><th>Caixas</th><th>Unidades</th><th>Peso (kg)</th><th>Lote</th><th>Validade</th></tr></thead><tbody>' +
      linhas.map((l) => '<tr>' + td(l.article) + td(l.name) + td(l.cases, 1) + td(l.pieces, 1) + td(String(round3(l.weight)).replace('.', ','), 1) + td(l.lot) + td(fmtDate(l.bbd)) + '</tr>').join('') +
      '<tr><td colspan="2"><b>Total</b></td>' + td(cmp.totalCx, 1) + td(linhas.reduce((t, l) => t + l.pieces, 0), 1) + '<td style="text-align:right"><b>' + esc(String(cmp.totalKg).replace('.', ',')) + '</b></td><td></td><td></td></tr></tbody></table>' +
      (order.observacoes ? '<p>Observações da encomenda: ' + esc(order.observacoes) + '</p>' : '') +
      '<p>Com os melhores cumprimentos,<br>' + esc(cfgForOrder(order, cfg).contacto) + '<br>' + esc(cfg.empresa) + '</p>';
    return { subject, html };
  }
  /* Email à Logifrio a pedir a correção da preparação. */
  function correctionEmail(order, cmp, cfg) {
    const subject = 'Correção da preparação - ' + cmp.refs.join(', ') + ' - ' + String(order.cliente || '').trim();
    const body = [salutation(cfg), '', 'A preparação ' + cmp.refs.join(', ') + ' não confere com o pedido de saída de stock ' + order.ref + ' (' + order.cliente + ', entrega a ' + fmtDate(order.dataEntrega) + '):', '',
      ...cmp.errors.map((e) => '- ' + e), '', 'Agradecemos que corrijam a preparação e nos enviem o relatório atualizado.', '', 'Com os melhores cumprimentos,', cfgForOrder(order, cfg).contacto, cfg.empresa].join('\n');
    return { subject, body };
  }

  return {
    ACTIVE_STATES, STATE_LABEL, DEFAULT_CONFIG, TRANSITIONS,

    isoToday, addDays, fmtDate, isIso, gs1CheckOk, lineKey, uid, round3,
    parseStockWorkbook, parseStockRows, mailItems, resultText, pickDailyReport, pickDailyReports, reportTags, mergeParsed, reportAttachment, stockRowsFromText, parseStockText, eligibility, reservedMap, stockView, suggest, suggestKg, makeAlloc, withEstimate, perBoxKg, lineKg, fmtKg, allocWeight, articleTaken,
    manualClient, mergeClients,

  };
});

function MemStore() {
  const mem = { orders: {}, cfg: null, pointer: null, chunks: {}, imports: {}, counter: {} };
  const subs = { orders: [], cfg: [], ptr: [] };
  const emit = (k, v) => subs[k].forEach((f) => f(v));
  return {
    kind: 'mem',
    onOrders(f) { subs.orders.push(f); f(Object.values(mem.orders).map(clone)); },
    onConfig(f) { subs.cfg.push(f); f(mem.cfg); },
    onPointer(f) { subs.ptr.push(f); f(mem.pointer); },
    async loadLines(id) { return clone(mem.chunks[id] || []); },
    async getOrders() { return Object.values(mem.orders).map(clone); },
    async getPointer() { return mem.pointer; },
    async saveOrder(o) { mem.orders[o.id] = clone(o); emit('orders', Object.values(mem.orders).map(clone)); },
    async saveConfig(c) { mem.cfg = clone(c); emit('cfg', mem.cfg); },
    async acquire() { return { acquired: true }; }, async release() {},
    async nextRef() { const d = Z.isoToday().replace(/-/g, '').slice(2); mem.counter[d] = (mem.counter[d] || 0) + 1; return 'MP-' + d + '-' + String(mem.counter[d]).padStart(2, '0'); },
    async saveImport(id, meta, lines) { mem.chunks[id] = clone(lines); mem.imports[id] = clone(meta); },
    async setPointer(p) { mem.pointer = clone(p); emit('ptr', mem.pointer); },
    async listImports() { return Object.values(mem.imports).sort((a, b) => (a.importedAt < b.importedAt ? 1 : -1)); },
    onClients(f) { subs.cli = subs.cli || []; subs.cli.push(f); f(mem.clients || null); },
    async saveClients(d) { mem.clients = clone(d); (subs.cli || []).forEach((f) => f(clone(d))); },
    onClientExtras(f) { subs.cx = subs.cx || []; subs.cx.push(f); f(mem.cx || null); },
    async saveClientExtras(list) { mem.cx = { items: clone(list) }; (subs.cx || []).forEach((f) => f(clone(mem.cx))); },
    onPreps(f) { subs.pr = subs.pr || []; subs.pr.push(f); f(Object.values(mem.preps || {}).map(clone)); },
    async savePrep(p) { mem.preps = mem.preps || {}; mem.preps[p.id] = clone(p); (subs.pr || []).forEach((f) => f(Object.values(mem.preps).map(clone))); },
    async deleteOrder(id) { delete mem.orders[id]; emit('orders', Object.values(mem.orders).map(clone)); },
    onFaltas(f) { subs.fa = subs.fa || []; subs.fa.push(f); f(Object.values(mem.faltas || {}).map(clone)); },
    async saveFalta(x) { mem.faltas = mem.faltas || {}; mem.faltas[x.id] = clone(x); (subs.fa || []).forEach((f) => f(Object.values(mem.faltas).map(clone))); },
    async deleteFalta(id) { if (mem.faltas) delete mem.faltas[id]; (subs.fa || []).forEach((f) => f(Object.values(mem.faltas || {}).map(clone))); },
    onCatalog(f) { subs.cat = subs.cat || []; subs.cat.push(f); f(mem.cat || null); },
    async saveCatalog(c) { mem.cat = clone(c); (subs.cat || []).forEach((f) => f(clone(mem.cat))); },
    async resetCounter() { mem.counter = {}; },
    async claim() { return { acquired: true }; }
  };
}
function DbStore(db) {
  const chains = {};
  const serial = (key, fn) => (chains[key] = (chains[key] || Promise.resolve()).then(fn, fn));
  const lockRef = db.doc('locks/reservas');
  return {
    kind: 'db',
    onOrders(f) { db.collection('orders').onSnapshot((s) => f(s.docs.map((d) => d.data())), onDbErr); },
    onConfig(f) { db.doc('config/settings').onSnapshot((s) => f(s.exists ? s.data() : null), onDbErr); },
    onPointer(f) { db.doc('stock/current').onSnapshot((s) => f(s.exists ? s.data() : null), onDbErr); },
    async loadLines(id) {
      const s = await db.collection('imports/' + id + '/chunks').get();
      return s.docs.slice().sort((a, b) => (a.id < b.id ? -1 : 1)).flatMap((d) => d.data().lines || []);
    },
    async getOrders() { const s = await db.collection('orders').get(); return s.docs.map((d) => clone(d.data())); },
    async getPointer() { const s = await db.doc('stock/current').get(); return s.exists ? s.data() : null; },
    saveOrder(o) { const body = clone(o); return serial('o/' + o.id, () => db.collection('orders').doc(o.id).set(body)); },
    saveConfig(c) { return serial('cfg', () => db.doc('config/settings').set(clone(c))); },
    acquire(holder) { return lockRef.acquire({ holder, ttlMs: 10000 }); },
    async release(holder) { await lockRef.acquire({ holder, ttlMs: 1000 }); },
    // Uma referência de cada vez nesta página (o bloqueio é por página: dois pedidos da mesma página entravam juntos e
    // davam a mesma referência) e nunca uma referência que já exista numa encomenda.
    nextRef() { const run = () => this._nextRef(); this._refChain = (this._refChain || Promise.resolve()).then(run, run); return this._refChain; },
    async _nextRef() {
      const d = Z.isoToday().replace(/-/g, '').slice(2);
      const lk = db.doc('locks/counter'); const holder = S.holder;
      let got = false;
      for (let i = 0; i < 20 && !got; i++) { got = (await lk.acquire({ holder, ttlMs: 5000 })).acquired; if (!got) await new Promise((r) => setTimeout(r, 300)); }
      try {
        const ref = db.doc('meta/counter'); const s = await ref.get();
        const c = s.exists ? s.data() : {}; let n = (c[d] || 0) + 1;
        try {
          const used = new Set((await db.collection('orders').get()).docs.map((x) => (x.data() || {}).ref));
          while (used.has('MP-' + d + '-' + String(n).padStart(2, '0'))) n++;
        } catch (e) { /* sem lista: fica o contador */ }
        await ref.set({ [d]: n });
        return 'MP-' + d + '-' + String(n).padStart(2, '0') + (got ? '' : '-' + Math.random().toString(36).slice(2, 5));
      } finally { try { await lk.acquire({ holder, ttlMs: 1000 }); } catch (e) {} }
    },
    async saveImport(id, meta, lines) {
      const size = 120;
      for (let i = 0, k = 0; i < lines.length; i += size, k++) {
        await db.doc('imports/' + id + '/chunks/c' + String(k).padStart(3, '0')).set({ lines: lines.slice(i, i + size) });
      }
      await db.doc('imports/' + id).set(meta);
    },
    setPointer(p) { return db.doc('stock/current').set(p); },
    async listImports() { const s = await db.collection('imports').orderBy('importedAt', 'desc').limit(15).get(); return s.docs.map((d) => d.data()); },
    onClients(f) { db.doc('clientes/lista').onSnapshot((s) => f(s.exists ? s.data() : null), onDbErr); },
    saveClients(d) { return serial('cli', () => db.doc('clientes/lista').set(clone(d))); },
    onClientExtras(f) { db.doc('clientes/extra').onSnapshot((s) => f(s.exists ? s.data() : null), onDbErr); },
    saveClientExtras(list) { return serial('cx', () => db.doc('clientes/extra').set({ items: clone(list), updatedAt: new Date().toISOString() })); },
    onPreps(f) { db.collection('preparacoes').onSnapshot((s) => f(s.docs.map((d) => d.data())), onDbErr); },
    savePrep(p) { const body = clone(p); return serial('p/' + p.id, () => db.collection('preparacoes').doc(p.id).set(body)); },
    deleteOrder(id) { return serial('o/' + id, () => db.collection('orders').doc(id).delete()); },
    claim(key, ttlMs) { return db.doc('locks/' + key).acquire({ holder: S.holder, ttlMs: ttlMs || 120000 }); },
    onFaltas(f) { db.collection('faltas').onSnapshot((s) => f(s.docs.map((d) => d.data())), onDbErr); },
    saveFalta(x) { const body = clone(x); return serial('fa/' + x.id, () => db.collection('faltas').doc(x.id).set(body)); },
    deleteFalta(id) { return serial('fa/' + id, () => db.collection('faltas').doc(id).delete()); },
    onCatalog(f) { db.doc('catalogo/artigos').onSnapshot((s) => f(s.exists ? s.data() : null), onDbErr); },
    saveCatalog(c) { const body = clone(c); return serial('cat', () => db.doc('catalogo/artigos').set(body)); },
    async resetCounter() {
      const lk = db.doc('locks/counter'); const holder = S.holder;
      for (let i = 0; i < 20; i++) { if ((await lk.acquire({ holder, ttlMs: 5000 })).acquired) break; await new Promise((r) => setTimeout(r, 300)); }
      try { await db.doc('meta/counter').set({}); } finally { try { await lk.acquire({ holder, ttlMs: 1000 }); } catch (e) {} }
    }
  };
}
let store = null;
function onDbErr(e) { toast('Ligação à base de dados: ' + (e && e.code === 'revoked' ? 'acesso retirado nesta vista.' : 'interrompida. Recarregue a página.')); }

async function boot() {
  const claude = window.claude;
  const use = (n) => (claude && claude.use ? claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user, dl, mcp] = await Promise.all([use('db'), use('user'), use('downloads'), use('mcp')]);
  S.caps = { db, user, dl, mcp };
  if (user) { try { const v = await user.me(); S.me.name = v.name || ''; S.me.email = v.email || null; } catch (e) {} try { S.me.id = await user.id(); } catch (e) {} try { S.canEdit = await user.canEdit(); } catch (e) {} try { S.canWrite = await user.can('data.write'); } catch (e) {} }
  S.holder = (S.me.id || 'anon') + ':' + Math.random().toString(36).slice(2, 8);
  setTimeout(loadPerfil, 0);
  if (mcp && !S.me.email) setTimeout(loadMsIdentity, 0);
  store = db ? DbStore(db) : MemStore();
  S.mode = db ? 'db' : 'mem';
  store.onConfig((c) => { S.cfg = Object.assign(clone(Z.DEFAULT_CONFIG), c || {}); render(); });
  store.onOrders((list) => {
    S.orders = list;
    if (S.edit) {
      const remote = list.find((o) => o.id === S.edit.id);
      if (remote && (remote.rev || 0) > (S.edit.rev || 0)) { S.remoteChanged = remote; }
    }
    resolveNames(list); render();
  });
  const mergeCli = () => { S.clients.items = Z.mergeClients(S.clientsList, S.clientExtras); };
  store.onClients((d) => { S.clientsList = d ? d.items || [] : []; S.clients = { items: [], meta: d || null }; mergeCli(); render(); });
  store.onClientExtras((d) => { S.clientExtras = d && d.items ? d.items : []; mergeCli(); render(); });
  S.preps = [];
  store.onPreps((list) => { S.preps = list || []; render(); });
  S.faltas = []; S.catalog = {};
  if (store.onFaltas) store.onFaltas((list) => { S.faltas = list || []; if (S.view === 'faltas' || S.view === 'order') render(); });
  if (store.onCatalog) store.onCatalog((c) => { S.catalog = (c && c.items) || {}; });
  setTimeout(autoPrepCheck, 4000);
  store.onPointer(async (p) => {

/* Os relatórios de preparação chegam por email (logistica.encomendas@zolve.pt) com o anexo …_PickingReport.xlsx.
   A app guarda-os em "preparacoes", associa cada um à encomenda certa, compara e:
   - se confere: deixa enviar os dados ao Financeiro;
   - se não confere: cria um alerta e só deixa avançar depois de corrigir a encomenda ou de a Logifrio corrigir a preparação. */
const PREP_STATES = ['preparada', 'enviada', 'concluida'];
const prepKey = (info) => ((info.zona || 'X') + '_' + String(info.zolveRef || 'sem-ref').replace(/[^A-Za-z0-9_.-]+/g, '-') + '_' + (info.date || '')).slice(0, 180);
const getOrder = (id) => (S.edit && S.edit.id === id ? S.edit : S.orders.find((o) => o.id === id));
async function persistOrder(o) { o.updatedAt = new Date().toISOString(); o.rev = (o.rev || 0) + 1; await store.saveOrder(o); }
const prepsOf = (o) => (S.preps || []).filter((p) => p.orderId === o.id);
const prepAlerts = () => S.orders.filter((o) => o.state !== 'cancelada' && o.prep && o.prep.status === 'divergente');

/* Recalcula a conferência de uma encomenda com as preparações associadas. */
async function recomputePrep(o, save) {
  const preps = prepsOf(o);
  const prev = o.prep && o.prep.status;
  if (!preps.length) { if (o.prep) { o.prep.status = 'sem-relatorio'; o.prep.erros = []; } }
  else {
    const cmp = Z.comparePreparation(o, preps);
    o.prep = Object.assign({}, o.prep || {}, { status: cmp.ok ? 'ok' : (o.prep && o.prep.aceite && o.prep.aceite.sig === prepSig(preps) ? 'corrigida' : 'divergente'), erros: cmp.errors, avisos: cmp.warnings, refs: cmp.refs, totalCx: cmp.totalCx, totalKg: cmp.totalKg, checkedAt: new Date().toISOString() });
    if (prev !== o.prep.status) Z.addHistory(o, S.me.id, o.prep.status === 'ok' ? 'Preparação confere' : o.prep.status === 'corrigida' ? 'Preparação aceite' : 'Preparação com divergências', cmp.refs.join(', ') + (cmp.errors.length ? ' · ' + cmp.errors.join(' | ') : ''));
  }
  if (save && prev !== (o.prep && o.prep.status)) await persistOrder(o);
  return o.prep;
}
const prepSig = (preps) => Z.latestPreps(preps).map((p) => p.id + '@' + (p.receivedAt || '')).sort().join(',');

let prepChecked = false;
async function autoPrepCheck() { if (prepChecked) return; prepChecked = true; if (!S.caps.mcp || !canWriteData()) return; await checkPreparations(true); }
/* Procura no email os relatórios de preparação novos, lê-os, guarda-os e associa-os às encomendas. */
async function checkPreparations(auto) {
  if (!S.caps.mcp || S.ui.prepBusy) return;
  S.ui.prepBusy = true; if (!auto) render();
  let novos = 0, assoc = 0, erros = [];
  try {
    // Só no assunto (o corpo das respostas do Financeiro também cita os relatórios) e dos últimos 30 dias.
    const desde = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
    let r;
    try { r = await S.caps.mcp.callTool('Microsoft 365', 'outlook_email_search', { query: 'subject:"Relatório de preparação"', afterDateTime: desde, limit: 25 }, { cache: false }); }
    catch (e) { r = await S.caps.mcp.callTool('Microsoft 365', 'outlook_email_search', { query: '"Relatório de preparação"', limit: 25 }, { cache: false }); }
    const items = Z.mailItems(r).filter((m) => Z.PREP_SUBJECT.test(m.subject || '') && !(m.receivedDateTime && m.receivedDateTime.slice(0, 10) < desde))
      .sort((a, b) => String(b.receivedDateTime || '').localeCompare(String(a.receivedDateTime || '')));
    const known = {}; (S.preps || []).forEach((p) => { known[p.id] = p; });
    const todo = [];
    for (const m of items) {
      const info = Z.prepInfoFromSubject(m.subject); if (!info.zolveRef || !info.date) continue;
      const id = prepKey(info); const at = m.receivedDateTime || '';
      const k = known[id];
      if (k && (k.msgIds || []).includes(m.id || m.uri)) continue;
      if (k && /^\s*(fw|fwd|enc|re)\s*:/i.test(m.subject || '')) continue;  // reencaminhamento de um relatório que já temos
      if (todo.some((t) => t.id === id)) continue;
      todo.push({ id, info, m, at });
    }
    for (const t of todo.slice(0, 12)) {
      try {
        const uri = t.m.uri || ('mail:///messages/' + encodeURIComponent(t.m.id || ''));
        const mr = await S.caps.mcp.callTool('Microsoft 365', 'read_resource', { uri }, { cache: false });
        const msg = Z.mailItems(mr)[0] || (mr && mr.payload) || {};
        const att = ((msg.attachments || []).filter((a) => !a.isInline && /pickingreport.*\.xlsx$|\.xlsx$/i.test(a.name || '')))[0];
        if (!att) { erros.push(t.info.zolveRef + ': sem o anexo PickingReport.xlsx'); continue; }
        const ar = await S.caps.mcp.callTool('Microsoft 365', 'read_resource', { uri: att.uri }, { cache: false });
        const pk = Z.parsePickingText(Z.resultText(ar));
        if (!pk.ok) { erros.push(t.info.zolveRef + ': ' + pk.errors.join(' ')); continue; }
        const old = (S.preps || []).find((p) => p.id === t.id);
        const doc = Object.assign({}, old || {}, t.info, { id: t.id, destinatario: Z.prepDestinatario(msg.body && (msg.body.content || msg.body)) || (old && old.destinatario) || '', lines: pk.lines, subject: t.m.subject, receivedAt: t.at > ((old && old.receivedAt) || '') ? t.at : (old && old.receivedAt) || t.at, ficheiro: att.name, msgIds: ((old && old.msgIds) || []).concat([t.m.id || t.m.uri]).slice(-10) });
        await store.savePrep(doc); novos++;
        const i = (S.preps || []).findIndex((p) => p.id === doc.id); if (i >= 0) S.preps[i] = doc; else (S.preps = S.preps || []).push(doc);
      } catch (e) { erros.push(t.info.zolveRef + ': ' + ((e && e.message) || e)); }
    }
    assoc = await autoLinkPreps();
    let fin = 0, finErr = 0;
    for (const o of S.orders) if (o.prep && prepsOf(o).length) {
      const oo = getOrder(o.id); await recomputePrep(oo, true);
      const r = await maybeAutoFinance(oo); if (r === true) fin++; else if (r === false) finErr++;
    }
    if (fin) toast(fin + ' encomenda(s) conferida(s) e enviada(s) ao Financeiro.');
    if (finErr) erros.push(finErr + ' envio(s) automático(s) ao Financeiro falharam: use o botão na encomenda');
    S.ui.prepMsg = { kind: erros.length ? 'warn' : 'ok', at: new Date().toISOString(), msg: (novos ? novos + ' relatório(s) de preparação novo(s)' : 'Sem relatórios de preparação novos') + (assoc ? ', ' + assoc + ' associado(s) a encomendas' : '') + '.' + (erros.length ? ' Problemas: ' + erros.join(' · ') : '') };
    if (auto && prepAlerts().length) toast('Atenção: ' + prepAlerts().length + ' encomenda(s) com divergências na preparação.');
  } catch (e) { S.ui.prepMsg = { kind: 'warn', at: new Date().toISOString(), msg: 'Não foi possível procurar os relatórios de preparação: ' + (MAIL_ERR[e && e.code] || (e && e.message) || e) }; }
  finally { S.ui.prepBusy = false; render(); }
}
/* Associa sozinho as preparações sem encomenda quando há uma candidata clara. */
async function autoLinkPreps() {
  let n = 0;
  const cand = S.orders.filter((o) => PREP_STATES.includes(o.state));
  for (const p of (S.preps || []).filter((x) => !x.orderId && !x.ignorada)) {
    const m = Z.matchPreparation(p, cand);
    if (m.sure) { await linkPrep(p.id, m.best.o.id, true); n++; }
    else if (m.best) { p.sugestao = { orderId: m.best.o.id, score: m.best.s.score }; }
  }
  return n;
}
async function linkPrep(prepId, orderId, auto) {
  const p = (S.preps || []).find((x) => x.id === prepId); const o = getOrder(orderId); if (!p || !o) return;
  p.orderId = o.id; p.associadaEm = new Date().toISOString(); p.associadaPor = auto ? 'auto' : S.me.id; delete p.sugestao;
  await store.savePrep(p);
  o.prep = o.prep || {};
  Z.addHistory(o, S.me.id, 'Relatório de preparação associado' + (auto ? ' (automático)' : ''), p.zolveRef + ' de ' + Z.fmtDate(p.date));
  await recomputePrep(o, false); await persistOrder(o);
  if (!auto && await maybeAutoFinance(o)) toast('A preparação confere: enviado ao Financeiro.');
}
async function unlinkPrep(prepId) {
  const p = (S.preps || []).find((x) => x.id === prepId); if (!p) return;
  const o = getOrder(p.orderId); p.orderId = null; p.ignorada = false; await store.savePrep(p);
  if (o) { Z.addHistory(o, S.me.id, 'Relatório de preparação desassociado', p.zolveRef); await recomputePrep(o, false); await persistOrder(o); }
  render();
}
async function acceptPrep(o) {

}

async function sendFinance(o, auto) {
  const preps = prepsOf(o); const cmp = Z.comparePreparation(o, preps);
  if (!(o.prep && (o.prep.status === 'ok' || o.prep.status === 'corrigida'))) return auto ? null : toast('A preparação ainda tem divergências por resolver.');
  const em = Z.financeEmail(o, preps, cmp, S.cfg);
  const to = String(S.cfg.emailFinanceiro || 'financeiro@montedopasto.pt').split(/[;,\s]+/).filter(Boolean);
  const me = identity();
  if (auto) {
    // Só uma pessoa envia: bloqueio por encomenda e confirmação na versão mais recente da encomenda.
    try { const c = store.claim ? await store.claim('fin_' + o.id, 120000) : { acquired: true }; if (!c.acquired) return null; } catch (e) { return null; }
    try { const fresh = (await store.getOrders()).find((x) => x.id === o.id); if (fresh && fresh.prep && fresh.prep.financeiro) { o.prep.financeiro = fresh.prep.financeiro; return null; } } catch (e) { return null; }
    try {
      await S.caps.mcp.callTool('Microsoft 365', 'outlook_send_mail', { to, cc: me.ok ? [me.email] : [], subject: em.subject, body: em.html, bodyType: 'html' });
      o.prep.financeiro = { at: new Date().toISOString(), by: S.me.id, para: to, totalCx: cmp.totalCx, totalKg: cmp.totalKg, auto: true };
      delete o.prep.financeiroErro;
      Z.addHistory(o, S.me.id, 'Dados enviados ao Financeiro (automático)', to.join(', ') + ' · ' + cmp.totalCx + ' cx · ' + String(cmp.totalKg).replace('.', ',') + ' kg · a preparação confere');
      await persistOrder(o);
      return true;
    } catch (e) { o.prep.financeiroErro = { at: new Date().toISOString(), msg: MS_ERR(e, 'enviar o email') }; await persistOrder(o); return false; }
  }
  if (!confirm('Enviar ao Financeiro (' + to.join(', ') + ') os dados para faturar a encomenda ' + o.ref + '?\n\n' + cmp.totalCx + ' caixas · ' + String(cmp.totalKg).replace('.', ',') + ' kg')) return;
  S.ui.busy = true; render();
  try {
    await S.caps.mcp.callTool('Microsoft 365', 'outlook_send_mail', { to, cc: me.ok ? [me.email] : [], subject: em.subject, body: em.html, bodyType: 'html' });
    o.prep.financeiro = { at: new Date().toISOString(), by: S.me.id, para: to, totalCx: cmp.totalCx, totalKg: cmp.totalKg };
    delete o.prep.financeiroErro;
    Z.addHistory(o, S.me.id, 'Dados enviados ao Financeiro', to.join(', ') + ' · ' + cmp.totalCx + ' cx · ' + String(cmp.totalKg).replace('.', ',') + ' kg');
    await persistOrder(o); toast('Enviado ao Financeiro.');
  } catch (e) { toast('Não foi possível enviar ao Financeiro: ' + MS_ERR(e, 'enviar o email')); }
  finally { S.ui.busy = false; render(); }
}
/* Envio automático ao Financeiro: só quando a preparação confere sem divergências (estado "ok"), ainda não foi enviado,
   a opção está ligada e o relatório chegou depois de esta função existir (não reenvia o que já foi tratado à mão). */
const FIN_AUTO_DESDE = '2026-11-05T11:00:00Z';
async function maybeAutoFinance(o) {
  if (!o || !o.prep || o.prep.status !== 'ok' || o.prep.financeiro || o.prep.financeiroErro || S.cfg.financeiroAuto === false) return null;
  if (!S.caps.mcp || !canWriteData() || !['preparada', 'enviada', 'concluida'].includes(o.state)) return null;
  const last = prepsOf(o).reduce((m, p) => ((p.receivedAt || '') > m ? p.receivedAt : m), '');
  if (!last || last < FIN_AUTO_DESDE) return null;
  return sendFinance(o, true);
}

// ---------------------------------------------------------------- faltas (produtos pedidos sem stock suficiente)
/* Catálogo de artigos (código → descrição, zona, kg por caixa), juntado a cada importação: permite pesquisar
   e pedir artigos que hoje não têm stock, para ficarem registados como falta. */
function updateCatalog(lines) {
  if (!store || !store.saveCatalog || !lines || !lines.length) return;
  const cat = Object.assign({}, S.catalog || {}); let changed = 0;
  const acc = {};
  for (const l of lines) {
    const a = acc[l.article] || (acc[l.article] = { name: '', zona: '', kg: 0, cx: 0 });
    if (!a.name && l.name) a.name = l.name;
    if (!a.zona && l.zone) a.zona = l.zone;
    if (l.weight > 0 && l.boxes > 0) { a.kg += l.weight; a.cx += l.boxes; }
  }
  for (const art in acc) {
    const a = acc[art], old = cat[art] || {};
    const kgCx = a.cx ? Math.round((a.kg / a.cx) * 1000) / 1000 : (old.kgCx || null);
    const next = { name: a.name || old.name || '', zona: a.zona || old.zona || '', kgCx };
    if (old.name !== next.name || old.zona !== next.zona || old.kgCx !== next.kgCx) { cat[art] = next; changed++; }
  }
  if (!changed) return;
  S.catalog = cat;
  store.saveCatalog({ items: cat, updatedAt: new Date().toISOString() }).catch(() => {});
}
function artName(art) { return names()[art] || ((S.catalog || {})[art] || {}).name || ''; }
function kgPerBox(art) {
  let kg = 0, cx = 0; S.stock.lines.forEach((l) => { if (l.article === art && l.weight > 0 && l.boxes > 0) { kg += l.weight; cx += l.boxes; } });
  if (cx) return kg / cx;
  const c = (S.catalog || {})[art]; return c && c.kgCx ? c.kgCx : null;
}
/* Regista (ou atualiza) a falta deste artigo nesta encomenda: uma por encomenda e artigo. */
function recordFalta(o, f) {
  if (!store || !store.saveFalta || !o) return;
  const pb = kgPerBox(f.article);
  const id = (o.id + '_' + f.article + (f.unit === 'kg' ? '_kg' : '')).replace(/[^A-Za-z0-9_.:-]/g, '_');
  // O mesmo artigo pedido outra vez na mesma encomenda soma ao que já faltava.
  const prev = (S.faltas || []).find((x) => x.id === id);
  if (prev) {
    f = Object.assign({}, f, { pedidoCx: (prev.pedidoCx || 0) + (f.pedidoCx || 0), pedidoKg: f.unit === 'kg' ? Z.round3((prev.pedidoKg || 0) + (f.pedidoKg || 0)) : f.pedidoKg,
      faltaCx: (prev.faltaCx || 0) + (f.faltaCx || 0), faltaKg: f.faltaKg != null ? Z.round3((prev.faltaKg || 0) + f.faltaKg) : null });
  }
  const faltaKg = f.faltaKg != null ? f.faltaKg : (pb && f.faltaCx ? Z.round3(f.faltaCx * pb) : null);
  const doc = Object.assign({
    id,
    at: new Date().toISOString(), by: S.me.id, byName: (identity() || {}).nome || '',
    orderId: o.id, orderRef: o.ref || '', cliente: o.cliente || '', local: o.local || '', dataEntrega: o.dataEntrega || '', dataExpedicao: o.dataExpedicao || '',
    stockDate: (S.stock.meta && S.stock.meta.fileDate) || ''
  }, f, { faltaKg, name: f.name || artName(f.article) });

function addLine() {

    const ln = { id: Z.uid('l'), article: art, name: nm, unit: 'kg', qtyKg: Z.round3(kg), qty: sk.boxes, allocations: sk.allocations };
    if (!sk.allocations.length) {

      S.ui.lastMsg = note('bad', art + ': não há stock com peso registado para propor', ['Disponível: ' + Z.fmtKg(sk.totalFreeKg) + '.'].concat(sk.semPeso.length ? [sk.semPeso.length + ' SSCC sem peso registado (pode pedir em caixas).'] : ['Ficou registado em Faltas.']));
      S.ui.pick = null; S.ui.q = ''; S.ui.addQty = ''; touch(true); return render();
    }
    o.lines.push(ln);
    if (sk.shortfallKg > 0) { const pb = kgPerBox(art); recordFalta(o, { article: art, name: nm, unit: 'kg', pedidoKg: Z.round3(kg), dispKg: Z.round3(sk.totalFreeKg || 0), faltaKg: Z.round3(sk.shortfallKg), faltaCx: pb ? Math.ceil(sk.shortfallKg / pb) : 0 }); }
    addHist(o, 'Artigo adicionado (kg)', art + ': ' + Z.fmtKg(ln.qtyKg) + ' → ' + sk.boxes + ' cx (≈ ' + Z.fmtKg(sk.estimatedKg) + ') → ' + sk.allocations.map((a) => a.sscc + ' (' + a.boxes + ')').join(', ') + (sk.shortfallKg ? ' · faltam ' + Z.fmtKg(sk.shortfallKg) : ''));
    S.ui.lastMsg = sk.shortfallKg ? note('bad', art + ': stock insuficiente', ['Pedidos ' + Z.fmtKg(ln.qtyKg) + ', disponíveis ≈ ' + Z.fmtKg(sk.totalFreeKg) + '.'].concat(sk.semPeso.length ? [sk.semPeso.length + ' SSCC sem peso registado não entram em pedidos em kg.'] : []))
      : '<div class="note info">' + h(art) + ': ' + h(Z.fmtKg(ln.qtyKg)) + ' pedidos → <b>' + sk.boxes + ' cx</b> em ' + sk.allocations.length + ' SSCC, ≈ ' + h(Z.fmtKg(sk.estimatedKg)) + '. O peso final é confirmado pelo armazém.</div>';
  } else {
    const qty = parseInt(S.ui.addQty, 10);
    if (!(qty > 0) || String(qty) !== String(S.ui.addQty).trim()) return toast('Indique um número inteiro de caixas.');
    const sg = Z.suggest(art, qty, view, S.cfg, Z.articleTaken(o, null));
    if (sg.shortfall > 0) recordFalta(o, { article: art, name: nm, unit: 'cx', pedidoCx: qty, dispCx: sg.totalFree || 0, faltaCx: sg.shortfall });
    if (!sg.allocations.length) {
      S.ui.lastMsg = note('bad', art + ': sem stock disponível', ['Pedidas ' + qty + ' cx, disponíveis 0 cx. Ficou registado em Faltas e não entra na encomenda.'].concat(sg.excluded && sg.excluded.length ? ['Há ' + sg.excluded.length + ' SSCC deste artigo excluídos (bloqueados, fora de validade ou já reservados).'] : []));
      S.ui.pick = null; S.ui.q = ''; S.ui.addQty = ''; touch(true); return render();
    }
    o.lines.push({ id: Z.uid('l'), article: art, name: nm, qty, allocations: sg.allocations });
    addHist(o, 'Artigo adicionado', art + ': ' + qty + ' cx → ' + sg.allocations.map((a) => a.sscc + ' (' + a.boxes + ')').join(', ') + (sg.shortfall ? ' · faltam ' + sg.shortfall + ' cx' : ''));
    S.ui.lastMsg = sg.shortfall ? note('bad', art + ': stock insuficiente', ['Pedidas ' + qty + ' cx, disponíveis ' + sg.totalFree + ' cx. A falta de ' + sg.shortfall + ' cx ficou registada em Faltas.', sg.excluded.length ? 'Há ' + sg.excluded.length + ' SSCC deste artigo excluídos (ver "Alterar SSCC" para o motivo de cada um).' : 'Não há mais SSCC deste artigo.'])
      : (sg.allocations.length > 1 ? '<div class="note info">' + h(art) + ': a quantidade não cabe num só SSCC e foi distribuída por ' + sg.allocations.length + ' SSCC, por ordem de validade.</div>' : null);
  }
  S.ui.pick = null; S.ui.q = ''; S.ui.addQty = '';
  touch(true); render();
}
function recalc() {
  const o = S.edit; const before = o.lines.map((l) => l.article + ':' + l.allocations.map((a) => a.sscc + '×' + a.boxes).join('+')).join(' | ');
  const tmp = Object.assign({}, o, { lines: [] });
  for (const ln of o.lines) {
    if (ln.unit === 'kg') { const sk = Z.suggestKg(ln.article, ln.qtyKg, orderView(o), S.cfg, Z.articleTaken(tmp, null)); ln.allocations = sk.allocations; ln.qty = sk.boxes; }
    else ln.allocations = Z.suggest(ln.article, ln.qty, orderView(o), S.cfg, Z.articleTaken(tmp, null)).allocations;
    tmp.lines.push(ln);
  }
  addHist(o, 'Propostas recalculadas', 'Antes: ' + before);
  touch(true); render(); toast('Propostas recalculadas.');
}
async function confirmOrder() {

  S.ui.busy = true; render();

    acquire: (hd) => store.acquire(hd), release: (hd) => store.release(hd),

    saveOrder: async (x) => { x.updatedAt = new Date().toISOString(); x.rev = (x.rev || 0) + 1; await store.saveOrder(x); }
  };
  const r = await Z.confirmWithLock(st, o.id, { holder: S.holder, by: S.me.id, cfg: S.cfg, expectedImportId: S.stock.importId });
  S.ui.busy = false;
  if (!r.ok) { S.ui.lastMsg = note('bad', 'Não foi possível confirmar', r.errors); render(); window.scrollTo(0, 0); return; }

async function transition(action, detail, mut) {
  const o = S.edit;

async function buildExcel(o) {
  stampRequester(o);
  if (!window.ExcelJS) throw new Error('A biblioteca de Excel não carregou. Recarregue a página.');
  const bin = Uint8Array.from(atob(TEMPLATE_B64), (c) => c.charCodeAt(0));
  const day = (o.preparedAt || new Date().toISOString()).slice(0, 10);
  if (!window.JSZip) throw new Error('A biblioteca de Excel não carregou. Recarregue a página.');
  const buf = await Z.buildFM01107(window.JSZip, bin, o, S.cfg, day);
  const ver = await Z.verifyWorkbook(window.ExcelJS, buf, o, S.cfg);
  if (!ver.ok) throw new Error('Verificação do Excel falhou: ' + ver.problems.join(' '));
  return buf;
}
function b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function emails(s) { return String(s || '').split(/[;,\s]+/).map((x) => x.trim()).filter(Boolean); }
function checkEmails(list) { return list.filter((x) => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)); }
function persistMail(o) { const m = S.ui.mail; o.emailPara = emails(m.to); o.emailCc = emails(m.cc); o.emailAssunto = m.subject; o.emailCorpo = m.body; }
/* Envio direto (só na versão GitHub: o conector do claude.ai não anexa ficheiros a emails). */
const CAN_SEND_ATTACH = !!window.ENCOMENDAS_CONFIG;
async function doSendDirect() {
  const o = S.edit; persistMail(o);
  if (!['confirmada', 'preparada'].includes(o.state)) return toast('Confirme primeiro a encomenda.');
  const to = emails(S.ui.mail.to), cc = emails(S.ui.mail.cc);
  const bad = checkEmails(to.concat(cc));
  if (!to.length) return toast('Indique pelo menos um destinatário.');
  if (bad.length) return toast('Endereço inválido: ' + bad.join(', '));
  if (!o.preparedAt) o.preparedAt = new Date().toISOString();
  const name = Z.fileName(o);
  if (!confirm('Enviar agora o pedido à Logifrio?\n\nPara: ' + to.join(', ') + (cc.length ? '\nCc: ' + cc.join(', ') : '') + '\nAssunto: ' + S.ui.mail.subject + '\nAnexo: ' + name + '\n\nO email sai do seu Outlook e não pode ser anulado.')) return;
  S.ui.busy = true; render();
  const notes = [];
  try {
    const buf = await buildExcel(o);
    const x64 = b64(buf);
    const sig = allocSig(o);
    if (S.cfg.spDriveId && S.cfg.spFolderId && !(o.excelSP && o.excelSP.sig === sig)) {
      try {
        const u = await S.caps.mcp.callTool('Microsoft 365', 'sharepoint_upload_file', { driveId: S.cfg.spDriveId, parentItemId: S.cfg.spFolderId, filename: name, contentBase64: x64, expectedBytes: buf.byteLength || buf.length, conflictBehavior: 'rename' });
        const p = u.payload || {};
        o.excelSP = { name: p.name || name, url: p.webUrl || (p.item && p.item.webUrl) || '', id: p.id || '', sig, at: new Date().toISOString() };
      } catch (e) { notes.push('A cópia do Excel não ficou guardada no SharePoint: ' + MS_ERR(e, 'guardar o Excel')); }
    }
    S.ui.mail.body = Z.refreshGreeting(S.ui.mail.body, S.cfg);
    await S.caps.mcp.callTool('Microsoft 365', 'outlook_send_mail', { to, cc, subject: S.ui.mail.subject, body: S.ui.mail.body, bodyType: 'text', attachments: [{ name, contentType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', contentBytes: x64 }] });
    const at = new Date().toISOString();
    o.envioDireto = { at, by: S.me.id, para: to, cc, subject: S.ui.mail.subject, ficheiro: name };
    S.ui.busy = false;
    const desc = Z.allocCount(o) + ' linhas, ' + Z.totalBoxes(o) + ' cx, Excel anexado: ' + name;
    if (o.state === 'confirmada') { o.state = 'preparada'; Z.addHistory(o, S.me.id, 'Preparada para envio', desc); }
    await transition('enviar', 'Email enviado pela app à Logifrio (' + to.join(', ') + ') com o Excel anexado', (x) => { x.sentAt = at; x.sentBy = S.me.id; });
    S.ui.lastMsg = notes.length ? note('warn', 'Enviado, com um aviso', notes) : null;
    toast('Pedido enviado à Logifrio com o Excel anexado.');
    render();
  } catch (e) {
    S.ui.busy = false;
    S.ui.lastMsg = note('bad', 'Email não enviado', [MS_ERR(e, 'enviar o email')].concat(notes));
    render(); window.scrollTo(0, 0);
  }
}

/* Verifica na pasta Rascunhos se o fluxo já criou a mensagem. tries: n.º de tentativas (de 20 em 20 s). */
async function checkOutlookDraft(o, quiet) {
  const d = o && o.gmailDraft; if (!d || d.app !== 'Outlook' || d.via !== 'fluxo') return false;
  try {
    const r = await S.caps.mcp.callTool('Microsoft 365', 'outlook_email_search', { folderName: 'Drafts', limit: 25 });
    const f = Z.findDraftInSearch(r && r.payload != null ? r.payload : r, d.subject, d.at, d.anteriores);
    if (f) {
      o.gmailDraft = Object.assign({}, d, { encontrado: true, id: f.id || d.id, url: f.url || d.url, anexado: f.hasAttachments === false ? false : true, encontradoEm: new Date().toISOString() });
      Z.addHistory(o, S.me.id, 'Rascunho Outlook criado pelo fluxo', f.hasAttachments === false ? 'Atenção: o Outlook indica que não tem anexo' : 'Com o Excel anexado');
      S.dirty = true; try { await saveNow(); } catch (e) { /* volta a gravar na próxima alteração */ }
      if (!quiet) toast('Rascunho encontrado no Outlook.');
      render(); return true;
    }
    if (!quiet) toast('Ainda não apareceu nos Rascunhos. Aguarde um pouco e verifique de novo.');
  } catch (e) { if (!quiet) toast(MS_ERR(e, 'verificar os rascunhos')); }

}
async function watchOutlookDraft(id, tries) {
  for (let i = 0; i < tries; i++) {
    await new Promise((r) => setTimeout(r, window.__SV_POLL_MS || 20000));
    const o = S.edit && S.edit.id === id ? S.edit : null;
    if (!o || !o.gmailDraft || o.gmailDraft.encontrado) return;
    if (await checkOutlookDraft(o, true)) return;
  }
  const o = S.edit && S.edit.id === id ? S.edit : null;
  if (o && o.gmailDraft && !o.gmailDraft.encontrado) { S.ui.lastMsg = note('warn', 'O rascunho ainda não apareceu', ['Passaram 2 minutos e o rascunho não está nos Rascunhos do Outlook.', 'Confirme que o fluxo "SalesVision – rascunho Outlook" está ligado no Power Automate (ver histórico de execuções).', 'Pode carregar em "Verificar rascunho" mais tarde, ou usar "Descarregar Excel".']); render(); }
}

function saveAdjust(lineId) {
  const o = S.edit; const ln = o.lines.find((l) => l.id === lineId);
  const vals = S.ui.adjust.vals;
  const view = orderView(o); const taken = Z.articleTaken(o, lineId);
  const allocs = []; const errs = [];
  for (const k in vals) {
    const n = vals[k] === '' ? 0 : Number(vals[k]);
    if (!n) continue;
    if (!Number.isInteger(n) || n < 0) { errs.push('Quantidades têm de ser números inteiros.'); continue; }
    const l = view.find((x) => x.key === k);
    if (!l || l.status !== 'elegivel') { errs.push('O SSCC ' + k.split('|')[0] + ' não está disponível.'); continue; }
    const free = Math.max(0, l.available - (taken[k] || 0));
    if (n > free) { errs.push('SSCC ' + l.sscc + ': só tem ' + free + ' cx livres.'); continue; }
    const prev = ln.allocations.find((a) => a.key === k);
    const a = Z.makeAlloc(l, n, prev && prev.boxes === n ? prev.source : 'manual', prev ? prev.why : 'Escolha manual');
    if (ln.unit === 'kg') Z.withEstimate(a, l);
    allocs.push(a);
  }
  const sum = allocs.reduce((s, a) => s + a.boxes, 0);
  if (!errs.length && ln.unit !== 'kg' && !S.ui.adjust.changeQty && sum !== ln.qty) errs.push('A soma (' + sum + ' cx) tem de ser igual à quantidade do artigo (' + ln.qty + ' cx), ou marque "Mudar a quantidade".');
  if (!errs.length && sum <= 0) errs.push('Escolha pelo menos uma caixa.');
  if (errs.length) { S.ui.lastMsg = note('bad', 'Alteração não guardada', errs); render(); return; }
  const fmt = (arr) => arr.map((a) => a.sscc + ' (' + a.boxes + ')').join(', ') || '—';
  Z.addHistory(o, S.me.id, 'SSCC alterados manualmente', ln.article + ' · antes: ' + fmt(ln.allocations) + ' · depois: ' + fmt(allocs) + (sum !== ln.qty ? ' · quantidade ' + ln.qty + ' → ' + sum + ' cx' : ''));
  ln.allocations = allocs; ln.qty = sum;
  S.ui.adjust = null; S.ui.lastMsg = null; touch(true); render();
}

  if (!G.length) out += '<div class="muted">Nenhum artigo com estes filtros.</div>';
