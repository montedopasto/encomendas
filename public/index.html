<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Encomendas</title>
<style>
  html, body { margin: 0; height: 100%; background: #F4F2ED; font-family: Montserrat, "Segoe UI", Arial, sans-serif; color: #1a1a1a }
  @media (prefers-color-scheme: dark) { html, body { background: #121212; color: #eee } }
  .sv-load { display: grid; place-items: center; height: 100% }
  .sv-load div { display: flex; align-items: center; gap: 14px; font-size: 15px }
  .sv-load img { width: 44px; height: 44px; border-radius: 8px }
  .sv-spin { width: 18px; height: 18px; border: 3px solid rgba(133, 96, 28, .25); border-top-color: #85601C; border-radius: 50%; animation: sv-r 0.8s linear infinite }
  @keyframes sv-r { to { transform: rotate(360deg) } }
</style>
<script src="config.js"></script>
<script src="vendor/msal-browser.min.js"></script>
</head>
<body>
<div class="sv-load"><div><img src="icon.png" alt=""><span>A abrir a app Encomendas…</span><span class="sv-spin" aria-hidden="true"></span></div></div>
<script>
/*
 * Arranque da app Encomendas (versão GitHub).
 *
 * Esta página não muda. Depois da entrada Microsoft, vai buscar a versão atual da app à pasta "app" do SharePoint,
 * ao lado da pasta "dados" (SalesVision › app: index.html e, se existir, platform.js). Assim, atualizar a app é
 * só pôr os ficheiros novos nessa pasta, sem mexer no GitHub.
 *
 * Se não houver sessão iniciada, a pasta não existir ou algo falhar, abre a cópia incluída no site (app.html),
 * que trata da entrada Microsoft e funciona como antes.
 *
 * IMPORTANTE: só o administrador da app pode ter permissão de ESCRITA na pasta "app" (os outros só leitura),
 * porque o que lá estiver é o código que corre para todos.
 */
(function () {
  'use strict';
  var LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (location.protocol === 'http:' && !LOCAL) { location.replace('https://' + location.host + location.pathname + location.search + location.hash); return; }
  var CFG = window.ENCOMENDAS_CONFIG || {};
  var GRAPH = 'https://graph.microsoft.com/v1.0';
  var SCOPES = ['User.Read', 'Mail.ReadWrite', 'Mail.Send', 'Files.ReadWrite.All'];
  var APP_FOLDER = CFG.appFolder || 'app';   // nome da pasta, ao lado de "dados"

  function show(html, platformSrc, origem) {
    if (platformSrc) html = html.replace('<script src="platform.js"><' + '/script>', '<script src="' + platformSrc + '"><' + '/script>');
    window.SV_APP_ORIGEM = origem;
    document.open(); document.write(html); document.close();
  }
  function fallback(motivo) {
    if (motivo) try { console.warn('[Encomendas] A usar a cópia incluída no site (app.html): ' + motivo); } catch (e) {}
    fetch('app.html', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (t) { show(t, null, { fonte: 'site', motivo: motivo || '' }); })
      .catch(function (e) { document.body.innerHTML = '<p style="padding:24px">Não foi possível abrir a app (' + String(e && e.message || e) + '). Recarregue a página.</p>'; });
  }
  if (!window.msal || !CFG.clientId || String(CFG.clientId).indexOf('COLOCAR') === 0 || !CFG.dataDriveId || !CFG.dataFolderId || !window.isSecureContext) { fallback('instalação incompleta ou ligação não segura'); return; }

  var redirect = location.origin + location.pathname;
  try { if (CFG.redirectUri && new URL(CFG.redirectUri, location.href).origin === location.origin) redirect = CFG.redirectUri; } catch (e) {}
  var pca;
  try { pca = new msal.PublicClientApplication({ auth: { clientId: CFG.clientId, authority: 'https://login.microsoftonline.com/' + CFG.tenantId, redirectUri: redirect }, cache: { cacheLocation: 'localStorage' } }); }
  catch (e) { fallback('MSAL: ' + (e && e.message)); return; }

  var D = encodeURIComponent(CFG.dataDriveId);
  function cacheGet(k) { try { return JSON.parse(localStorage.getItem('sv-app:' + k) || 'null'); } catch (e) { return null; } }
  function cacheSet(k, v) { try { localStorage.setItem('sv-app:' + k, JSON.stringify(v)); } catch (e) { /* sem espaço: lê-se sempre do SharePoint */ } }

  (async function () {
    await pca.initialize();
    var red = await pca.handleRedirectPromise().catch(function () { return null; });
    var account = (red && red.account) || pca.getActiveAccount() || pca.getAllAccounts()[0] || null;
    if (!account) return fallback('sem sessão iniciada (a app pede a entrada Microsoft)');
    var tok;
    try { tok = (await pca.acquireTokenSilent({ scopes: SCOPES, account: account })).accessToken; }
    catch (e) { return fallback('sessão expirada'); }
    var get = async function (path, asText) {
      var r = await fetch(GRAPH + path, { headers: { Authorization: 'Bearer ' + tok } });
      if (!r.ok) { var err = new Error('HTTP ' + r.status + ' em ' + path); err.status = r.status; throw err; }
      return asText ? r.text() : r.json();
    };
    try {
      var dados = await get('/drives/' + D + '/items/' + encodeURIComponent(CFG.dataFolderId) + '?$select=id,parentReference');
      var pai = dados.parentReference && dados.parentReference.id; if (!pai) return fallback('pasta de dados sem pasta-mãe');
      var kids = (await get('/drives/' + D + '/items/' + encodeURIComponent(pai) + ':/' + encodeURIComponent(APP_FOLDER) + ':/children')).value || [];
      var byName = {}; kids.forEach(function (k) { if (k.file) byName[k.name.toLowerCase()] = k; });
      var idx = byName['index.html']; if (!idx) return fallback('pasta "' + APP_FOLDER + '" sem index.html');
      var ler = async function (item) {
        var c = cacheGet(item.name);
        if (c && c.etag === item.eTag && c.text) return c.text;
        var t = await get('/drives/' + D + '/items/' + encodeURIComponent(item.id) + '/content', true);
        cacheSet(item.name, { etag: item.eTag, text: t });
        return t;
      };
      var html = await ler(idx);
      if (html.indexOf('<html') < 0 || html.indexOf('platform.js') < 0) return fallback('index.html da pasta "' + APP_FOLDER + '" não parece a app');
      var plat = byName['platform.js'] ? URL.createObjectURL(new Blob([await ler(byName['platform.js'])], { type: 'application/javascript' })) : null;
      show(html, plat, { fonte: 'sharepoint', pasta: APP_FOLDER, versao: idx.lastModifiedDateTime || '', etag: idx.eTag || '' });
    } catch (e) {
      fallback(e && e.status === 404 ? 'ainda não há pasta "' + APP_FOLDER + '" no SharePoint' : (e && e.message) || String(e));
    }
  })().catch(function (e) { fallback((e && e.message) || String(e)); });
})();
</script>
</body>
</html>
